<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Summer Body 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-page: #f0f1f4;
      --bg-card: #ffffff;
      --bg-soft: #f4f5f7;
      --bg-softer: #fafafb;
      --border: #e5e7eb;
      --border-soft: #eef0f2;
      --text-1: #111827;
      --text-2: #4b5563;
      --text-3: #9ca3af;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 2px rgba(17,24,39,0.04), 0 1px 1px rgba(17,24,39,0.02);
      --shadow-md: 0 4px 12px rgba(17,24,39,0.06);
      --shadow-lg: 0 10px 30px rgba(17,24,39,0.08);
      --tabbar-h: 68px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --migraine: #DC2626;
      --migraine-soft: #FEE2E2;
      --migraine-border: #FCA5A5;
      --caffeine: #92400E;
      --caffeine-soft: #FEF3C7;
      --caffeine-border: #FCD34D;
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    html, body {
      height: 100%;
      background-color: var(--bg-page);
      overscroll-behavior: contain;
    }

    body {
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      font-family: var(--font-sans);
      color: var(--text-1);
      font-size: 15px;
      line-height: 1.5;
      touch-action: manipulation;
    }

    button, .pill, .tb {
      -webkit-user-select: none;
      user-select: none;
    }

    .app{
      width:100%;
      max-width:680px;
      min-height:100vh;
      min-height:100dvh;
      background:var(--bg-card);
      box-shadow:0 0 40px rgba(17,24,39,0.06);
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .top-strip {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      padding: calc(var(--safe-top) + 14px) 20px 14px;
      z-index: 5;
      border-bottom: 1px solid transparent;
      transition: border-color .2s ease;
    }
    .top-strip.scrolled { border-bottom-color: var(--border-soft); }
    .top-strip-eyebrow { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .8px; font-weight: 600; margin-bottom: 2px; }
    .top-strip-title { font-size: 22px; font-weight: 700; color: var(--text-1); letter-spacing: -0.02em; line-height: 1.2; }

    .sec {
      display: none;
      flex: 1;
      padding: 16px 16px calc(var(--tabbar-h) + var(--safe-bottom) + 24px);
      animation: fadeIn .18s ease;
    }
    .sec.on { display: block; }
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loader-cnt { display:flex; flex-direction:column; align-items:center; justify-content:center; height:60vh; color:var(--text-3); }
    .loader-cnt i { font-size:32px; animation: spin 1s linear infinite; margin-bottom:12px; }

    .tabs{
      position:fixed;
      bottom:0; left:0; right:0;
      z-index:20;
      display:flex;
      gap:0;
      background:rgba(255,255,255,0.96);
      backdrop-filter:saturate(180%) blur(20px);
      -webkit-backdrop-filter:saturate(180%) blur(20px);
      border-top:1px solid var(--border);
      padding: 6px 4px calc(var(--safe-bottom) + 6px);
      max-width:680px;
      margin:0 auto;
    }
    .tb{
      flex:1;
      padding:10px 4px 8px;
      background:none;
      border:none;
      cursor:pointer;
      font-family:var(--font-sans);
      font-size:10.5px;
      font-weight:500;
      color:var(--text-3);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      position:relative;
      min-height:48px;
      transition:color .12s ease, transform .1s ease;
    }
    .tb i{font-size:22px;line-height:1}
    .tb.on{color:var(--text-1);font-weight:600}
    .tb.on i { transform: scale(1.05); transition: transform .15s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .tb:active{transform:scale(0.94)}

    .card{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
    .card-soft{ background:var(--bg-soft); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 16px; margin-bottom:12px; }
    .card-feature{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px 18px 22px; margin-bottom:14px; box-shadow:var(--shadow-md); position:relative; overflow:hidden; }

    button.card, button.card-feature, .toggle-card { transition: transform .1s ease, box-shadow .15s ease, border-color .15s ease; }
    button.card:active, button.card-feature:active, .toggle-card:active { transform: scale(0.985); }

    .h-eyebrow{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:8px}
    .t1{font-size:16px;font-weight:600;color:var(--text-1);line-height:1.35}
    .t2{font-size:14px;color:var(--text-2);line-height:1.45}
    .t3{font-size:13px;color:var(--text-2);line-height:1.45}
    .t4{font-size:12px;color:var(--text-3);line-height:1.4}
    .nbig{font-size:26px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em;line-height:1}
    .nmed{font-size:20px;font-weight:600;color:var(--text-1);letter-spacing:-0.01em}
    .bet{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .row{display:flex;align-items:center;gap:8px}

    .tag{display:inline-flex;align-items:center;padding:4px 9px;border-radius:7px;font-size:11px;font-weight:600;gap:4px;letter-spacing:.2px}
    .tp{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
    .tl{background:#E6F1FB;color:#0C447C;border:1px solid #85B7EB}
    .tg{background:#FAEEDA;color:#633806;border:1px solid #EF9F27}
    .tu{background:#F1E8FB;color:#4A1F73;border:1px solid #B47AE0}
    .tlw{background:#FBE7DF;color:#7B2D14;border:1px solid #F08A6B}
    .tr{background:#EEEDFE;color:#3C3489;border:1px solid #AFA9EC}
    .tcup{background:#FBEAF0;color:#72243E;border:1px solid #ED93B1}
    .tmig{background:var(--migraine-soft);color:#7F1D1D;border:1px solid var(--migraine-border)}
    .tcaf{background:var(--caffeine-soft);color:#78350F;border:1px solid var(--caffeine-border)}

    .pill{
      padding:9px 15px; border-radius:22px; border:1px solid var(--border); background:var(--bg-card); cursor:pointer;
      font-size:12.5px; font-weight:500; font-family:var(--font-sans); color:var(--text-2); white-space:nowrap; min-height:36px; transition:all .12s ease;
    }
    .pill:active{transform:scale(0.95)}
    .pill.ap{background:#E1F5EE;border-color:#5DCAA5;color:#085041;font-weight:600}
    .pill.ab{background:#E6F1FB;border-color:#85B7EB;color:#0C447C;font-weight:600}
    .pill.aa{background:#FAEEDA;border-color:#EF9F27;color:#633806;font-weight:600}
    .pill.au{background:#F1E8FB;border-color:#B47AE0;color:#4A1F73;font-weight:600}
    .pill.alw{background:#FBE7DF;border-color:#F08A6B;color:#7B2D14;font-weight:600}
    .pill.ac{background:var(--text-1);border-color:var(--text-1);color:#fff;font-weight:600}

    .dgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:8px; margin-bottom:20px; }
    .dbtn{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 4px; cursor:pointer; text-align:center; font-family:var(--font-sans); width:100%; min-height:74px; transition:all .12s ease; }
    .dbtn:active{transform:scale(0.95)}
    .dbtn.off{opacity:.4}
    .dbtn.tdy{border:2px solid var(--text-1);box-shadow:0 0 0 3px rgba(17,24,39,0.06)}

    .srow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .srow.s3{grid-template-columns:repeat(3,1fr)}
    .sbtn{ height:54px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-soft); cursor:pointer; font-family:var(--font-sans); font-size:15px; font-weight:600; color:var(--text-2); transition:all .1s ease; }
    .sbtn:active{transform:scale(0.93);background:var(--bg-card)}
    .sbtn.done{background:#E1F5EE;border-color:#5DCAA5;color:#085041}

    .wctrl{display:flex;align-items:center;gap:14px}
    .wbtn{ width:52px; height:52px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-soft); cursor:pointer; font-size:24px; color:var(--text-1); font-family:var(--font-sans); font-weight:500; transition:all .1s ease; display:flex; align-items:center; justify-content:center; }
    .wbtn:active{transform:scale(0.92);background:var(--bg-card)}
    .wval{flex:1;text-align:center;font-size:20px;font-weight:600;color:var(--text-1);letter-spacing:-0.01em}

    .ptrack{height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden;margin-top:12px}
    .pfill{height:100%;border-radius:4px;transition:width .3s ease}

    .shbtn{ display:flex; align-items:center; gap:14px; padding:14px 0; border:none; border-bottom:1px solid var(--border-soft); background:none; width:100%; cursor:pointer; font-family:var(--font-sans); transition:opacity .15s ease; min-height:56px; }
    .shbtn:last-child{border-bottom:none}
    .shbtn:active{opacity:0.6}
    .shbtn.dn{opacity:.45}
    .cb{ width:26px; height:26px; border-radius:7px; border:1.5px solid #cdd1d8; background:var(--bg-card); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .12s ease; }
    .cb.on{background:#E1F5EE;border-color:#5DCAA5;color:#085041}

    .exacc{ border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:10px; overflow:hidden; background:var(--bg-card); }
    .exhdr{ display:flex; align-items:center; gap:12px; padding:16px 14px; cursor:pointer; background:none; border:none; width:100%; font-family:var(--font-sans); text-align:left; transition:background .12s ease; min-height:64px; }
    .exhdr:active{background:var(--bg-soft)}
    .exbdy{padding:6px 16px 18px;border-top:1px solid var(--border-soft);background:var(--bg-softer)}
    
    .tipbox{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px; font-size:13.5px; color:var(--text-2); margin:14px 0; line-height:1.5; display:flex; gap:10px; }
    .tipbox i{color:#EF9F27;flex-shrink:0;margin-top:2px;font-size:18px}

    .mlacc{border-bottom:1px solid var(--border-soft)}
    .mlacc:last-child{border-bottom:none}
    .mlhdr{ display:flex; align-items:center; padding:16px 0; cursor:pointer; background:none; border:none; width:100%; font-family:var(--font-sans); gap:12px; text-align:left; min-height:64px; }
    .mlhdr:active{opacity:0.7}

    .mgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
    .mbox{ text-align:center; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 4px; box-shadow:var(--shadow-sm); }
    .stepn{ width:26px; height:26px; border-radius:50%; background:var(--bg-card); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text-1); flex-shrink:0; margin-top:2px; }

    .savbtn{ width:100%; padding:18px; background:var(--text-1); border:none; border-radius:var(--radius-md); cursor:pointer; font-family:var(--font-sans); font-size:15px; font-weight:600; color:#fff; margin-top:16px; display:flex; align-items:center; justify-content:center; gap:8px; transition:all .12s ease; box-shadow:var(--shadow-md); min-height:56px; }
    .savbtn:active{transform:scale(0.98);box-shadow:var(--shadow-sm)}
    .savbtn.sv{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5;box-shadow:none}

    .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .qstat{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 6px; text-align:center; box-shadow:var(--shadow-sm); }
    .qstat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
    .qicon{font-size:22px;color:var(--text-2);margin-bottom:6px}
    .qval{font-size:16px;font-weight:600;color:var(--text-1);letter-spacing:-0.01em}
    .qlbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:3px}

    .streak-row{display:grid;grid-template-columns:64px repeat(7,1fr);gap:5px;align-items:center;margin-bottom:6px}
    .streak-cell{ aspect-ratio:1; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; }
    .streak-on{background:#E1F5EE;color:#085041}
    .streak-off{background:var(--bg-soft);color:var(--text-3)}
    .streak-today{outline:2px solid var(--text-1);outline-offset:1px}

    .run-input{ width:100%; height:48px; padding:0 14px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-soft); font-family:var(--font-sans); font-size:16px; color:var(--text-1); transition:border-color .12s ease, background .12s ease; -webkit-appearance: none; appearance: none; }
    .run-input:focus{outline:none;border-color:var(--text-2);background:var(--bg-card)}
    .run-input::-webkit-outer-spin-button, .run-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .run-input[type=number] { -moz-appearance: textfield; }

    .toggle-card{ cursor:pointer; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:12px; width:100%; text-align:left; font-family:var(--font-sans); box-shadow:var(--shadow-sm); min-height:64px; }
    .toggle-card.on{background:#E1F5EE;border-color:#5DCAA5}

    .cup-card{ background:linear-gradient(135deg,#FBEAF0 0%,#FCEEF3 100%); border:1px solid #ED93B1; border-radius:var(--radius-md); padding:16px 18px; margin-bottom:12px; }
    .cup-section{ padding:13px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); margin-top:10px; }

    .accent-bar{ position:absolute; left:0; top:0; bottom:0; width:5px; }

    .pill-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:18px; -webkit-overflow-scrolling:touch; scrollbar-width:none; scroll-snap-type: x proximity; padding-left: 2px; padding-right: 2px; }
    .pill-row::-webkit-scrollbar{display:none}
    .pill-row .pill { scroll-snap-align: start; }

    .macro-tag{ padding:5px 11px; border-radius:7px; font-size:12px; font-weight:600; }
    .macro-e{background:#E6F1FB;border:1px solid #85B7EB;color:#0C447C}
    .macro-c{background:#FAEEDA;border:1px solid #EF9F27;color:#633806}
    .macro-v{background:#FBEAF0;border:1px solid #ED93B1;color:#72243E}

    .train-progress { position: sticky; top: 0; z-index: 4; background: rgba(255,255,255,0.96); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); margin: -16px -16px 14px; padding: 12px 16px 12px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 12px; }
    .train-progress-info { flex: 1; min-width: 0; }
    .train-progress-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
    .train-progress-bar { height: 6px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; }
    .train-progress-fill { height: 100%; background: var(--text-1); transition: width .3s ease; border-radius: 3px; }
    .train-progress-pct { font-size: 14px; font-weight: 600; color: var(--text-1); flex-shrink: 0; }

    .sec-header { font-size:11px; color:var(--text-3); text-transform:uppercase; letter-spacing:.7px; font-weight:600; margin: 8px 4px 12px; }
    .daypart-header { font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.8px; font-weight:600; margin: 18px 4px 10px; display:flex; align-items:center; gap:8px; }
    .daypart-header:first-child { margin-top: 8px; }
    .daypart-header i { font-size:14px; }

    /* === MIGRAINE TRACKER STYLES === */
    .panic-btn {
      width: 100%;
      padding: 22px 20px;
      background: linear-gradient(135deg, #DC2626 0%, #B91C1C 100%);
      border: none;
      border-radius: var(--radius-lg);
      color: white;
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(220, 38, 38, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      transition: all .15s ease;
      letter-spacing: -0.01em;
    }
    .panic-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3); }
    .panic-btn i { font-size: 24px; }
    .panic-btn.active {
      background: linear-gradient(135deg, #991B1B 0%, #7F1D1D 100%);
    }

    .active-migraine-card {
      background: var(--migraine-soft);
      border: 2px solid var(--migraine-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 14px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.3); }
      50% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
    }

    .med-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .med-tile {
      padding: 18px 8px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: var(--font-sans);
      text-align: center;
      transition: all .15s ease;
      box-shadow: var(--shadow-sm);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .med-tile:active { transform: scale(0.95); background: var(--bg-soft); }
    .med-tile i { font-size: 28px; margin-bottom: 4px; }
    .med-tile-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
    .med-tile-unit { font-size: 11px; color: var(--text-3); font-weight: 500; }
    .med-tile-count { font-size: 18px; font-weight: 700; color: var(--text-1); margin-top: 2px; }
    .med-tile.parac { border-color: #FCA5A5; }
    .med-tile.parac i { color: #DC2626; }
    .med-tile.napro { border-color: #93C5FD; }
    .med-tile.napro i { color: #2563EB; }
    .med-tile.suma { border-color: #C4B5FD; }
    .med-tile.suma i { color: #7C3AED; }

    .caffeine-control {
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      gap: 10px;
      align-items: center;
    }
    .caf-bean {
      display: inline-block;
      width: 16px;
      height: 16px;
      background: var(--caffeine);
      border-radius: 50%;
      margin: 0 1px;
    }

    .med-log-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }
    .med-log-row:last-child { border-bottom: none; }
    .med-log-row > .med-log-info { flex: 1; min-width: 0; }
    .med-log-time-input {
      width: 100%;
      max-width: 180px;
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      background: var(--bg-soft);
      box-sizing: border-box;
    }
    .med-log-del {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .med-log-del:active { background: var(--bg-soft); }

    .time-input-group {
      display: grid;

  const TCONF = {

          await signInAnonymously(auth);

        currentUserId = auth.currentUser?.uid || crypto.randomUUID();

  async function cloudGet(key) {
    if (!useFirebase || !isFirebaseReady || !currentUserId) return null;
    try {
      const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, key, 'doc');
      const snap = await getDoc(docRef);
      if (snap.exists()) return JSON.parse(snap.data().data);
      return null;
    } catch(e) { console.error(e); return null; }
  }
  
  async function cloudSet(key, val) {
    if (!useFirebase || !isFirebaseReady || !currentUserId) return;
    try {
      const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, key, 'doc');
      await setDoc(docRef, { data: JSON.stringify(val) });
    } catch(e) { console.error(e); }
  }

  async function loadCloud() {
    try {
      const [a,w,l,s,d,m] = await Promise.all([
        cloudGet('avail'), cloudGet('weights'), cloudGet('logs'), cloudGet('shop'), cloudGet('daily'), cloudGet('migraines')
      ]);
      avail = a || {};
      weights = w || {};
      logs = l || {};
      shopCk = s || {};
      daily = d || {};
      migraines = m || [];

      Object.keys(daily).forEach(date => {
        const d = daily[date];
        if (typeof d === 'object' && d !== null) {
          if (d.caffeine_units === undefined) d.caffeine_units = 0;
          if (d.bedTime === undefined) d.bedTime = '';
          if (d.wakeTime === undefined) d.wakeTime = '';
        }
      });

  function nxtW(cur,done,target,compound){if(done>=target)return Math.round((cur+(compound?2.5:1.25))*4)/4;if(done>=Math.ceil(target*.75))return cur;return Math.round((cur*.95)*4)/4}
  function isAv(d){return avail[d]!==false}
  function isTrainDay(d){return!!TD.find(td=>td.date===d&&isAv(td.date))}
  function getTrainType(d){const td=TD.find(t=>t.date===d&&isAv(t.date));return td?td.type:null}
  function waterTarget(d){return isTrainDay(d)?3500:3000}
  function getDay(d){
    return daily[d]||{water:0,sleep:0,creat:false,runKm:0,runMin:0,caffeine_units:0,bedTime:'',wakeTime:''};
  }

  function calcSleepHours(bedTime, wakeTime) {
    if (!bedTime || !wakeTime) return 0;
    const [bh, bm] = bedTime.split(':').map(Number);
    const [wh, wm] = wakeTime.split(':').map(Number);
    if (isNaN(bh) || isNaN(wh)) return 0;
    let bedMinutes = bh * 60 + bm;
    let wakeMinutes = wh * 60 + wm;
    if (bedMinutes >= 18 * 60) {
      wakeMinutes += 24 * 60;
    } else if (wakeMinutes < bedMinutes) {
      wakeMinutes += 24 * 60;
    }
    const diff = wakeMinutes - bedMinutes;
    return Math.round((diff / 60) * 10) / 10;
  }

  function bedtimeMinutesFromNoon(bedTime) {
    if (!bedTime) return null;
    const [bh, bm] = bedTime.split(':').map(Number);
    if (isNaN(bh)) return null;
    let mins = bh * 60 + bm;
    if (mins >= 18 * 60) mins = mins - 24 * 60;
    return mins;
  }

  function nowHHMM() {
    const d = new Date();
    return d.toTimeString().slice(0, 5);
  }

  function nowISO() {
    return new Date().toISOString();
  }

  function switchTab(tab){
    document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===tab))
    window.scrollTo({top: 0, behavior: 'instant'});
    rerenderActive(tab);
  }
  function safe(fn){try{fn()}catch(e){console.error(e)}}

  function dn(d){return['Zo','Ma','Di','Wo','Do','Vr','Za'][new Date(d).getDay()]}
  function dnL(d){return['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'][new Date(d).getDay()]}
  function dnum(d){return new Date(d).getDate()}
  function fdate(str){const d=new Date(str);const mn=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];return`${dnL(str)} ${d.getDate()} ${mn[d.getMonth()]}`}
  function fdateShort(str){const d=new Date(str);const mn=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];return`${d.getDate()} ${mn[d.getMonth()]}`}

  function fmtTime(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return d.toTimeString().slice(0, 5);
    } catch { return '—'; }
  }
  function fmtDateTime(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      return `${fdateShort(d.toISOString().split('T')[0])} ${d.toTimeString().slice(0,5)}`;
    } catch { return '—'; }
  }

  function getActiveMigraine() {
    for (let i = migraines.length - 1; i >= 0; i--) {
      if (!migraines[i].endTime) return { idx: i, ...migraines[i] };
    }
    return null;
  }

    const cafUnits = d.caffeine_units || 0;
    const caffeine = `<div class="card">
      <div class="bet" style="margin-bottom:14px">
        <div><div class="t1"><i class="ti ti-coffee" style="color:#92400E"></i> Cafeïne</div><div class="t4" style="margin-top:2px">1 eenheid = 1 koffie / thee / cola</div></div>

        <div><div class="t4" style="margin-bottom:6px">Tijd (min)</div><input class="run-input" type="number" inputmode="numeric" enterkeyhint="done" min="0" step="1" value="${d.runMin||''}" placeholder="0" onchange="updR('runMin',this.value)" /></div>
      </div>
      ${d.runKm>0&&d.runMin>0?`<p class="t4" style="margin-top:12px">Tempo: ${(d.runMin/d.runKm).toFixed(2)} min/km · ~${Math.round(d.runKm*70)} kcal</p>`:''}

    // --- LAATSTE 7 DAGEN ---
    const last7=[]
    const tD=new Date(t)
    for(let i=6;i>=0;i--){

    setupScrollDetection(el);

  function setupScrollDetection(el) {
    const strip = el.querySelector('.top-strip');
    if (!strip) return;
    const onScroll = () => { strip.classList.toggle('scrolled', window.scrollY > 4); };
    window.removeEventListener('scroll', window._scrollHandler);
    window._scrollHandler = onScroll;
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function ensureDay(t) {
    if (!daily[t]) {
      daily[t] = {water:0,sleep:0,creat:false,runKm:0,runMin:0,caffeine_units:0,bedTime:'',wakeTime:''};
    } else {
      if (daily[t].caffeine_units === undefined) daily[t].caffeine_units = 0;
      if (daily[t].bedTime === undefined) daily[t].bedTime = '';
      if (daily[t].wakeTime === undefined) daily[t].wakeTime = '';
    }
  }

  function adjW(delta){
    const t=TODAY;
    ensureDay(t);
    daily[t].water=Math.max(0,(daily[t].water||0)+delta);
    safe(rVandaag);
    sset('daily',daily);
  }
  function updSleep(field, val) {
    const t=TODAY;
    ensureDay(t);
    daily[t][field] = val;
    daily[t].sleep = calcSleepHours(daily[t].bedTime, daily[t].wakeTime);
    safe(rVandaag);
    sset('daily',daily);
  }
  function adjCaf(delta) {
    const t=TODAY;
    ensureDay(t);
    daily[t].caffeine_units = Math.max(0, (daily[t].caffeine_units||0) + delta);
    safe(rVandaag);
    sset('daily',daily);
  }
  function tgCreat(){
    const t=TODAY;
    ensureDay(t);
    daily[t].creat=!daily[t].creat;
    safe(rVandaag);
    sset('daily',daily);
  }
  function updR(field,val){
    const t=TODAY;
    ensureDay(t);
    daily[t][field]=parseFloat(val)||0;
    safe(rVandaag);
    sset('daily',daily);
  }

  // ============================================================
  // MIGRAINE FUNCTIES
  // ============================================================
  function startMigraine() {
    const newMig = {
      id: 'mig_' + Date.now(),
      startTime: nowISO(),
      endTime: null,
      medicationLog: [],
      severity: null,
      notes: ''
    };
    migraines.push(newMig);
    safe(rVandaag);
    sset('migraines', migraines);
  }

  function addMed(type) {
    const active = getActiveMigraine();
    if (!active) return;
    migraines[active.idx].medicationLog = migraines[active.idx].medicationLog || [];
    migraines[active.idx].medicationLog.push({
      type,
      time: nowISO()
    });
    safe(rVandaag);
    sset('migraines', migraines);
  }

  function endMigraine() {
    const active = getActiveMigraine();
    if (!active) return;
    migraines[active.idx].endTime = nowISO();
    safe(rVandaag);
    sset('migraines', migraines);
  }

  function viewMigraineDetail() {
    const active = getActiveMigraine();
    if (!active) return;
    showMigraineEditor(active.idx);
  }

  // ============================================================
  // REST TIMER (90s vast, korte vibratie start, 2x bij einde)
  // ============================================================
  function vibrate(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* niet beschikbaar op iOS Safari, dat is OK */ }
  }

  function startRestTimer() {
    // Cancel bestaande timer
    if (restTimerInterval) {
      clearInterval(restTimerInterval);
      restTimerInterval = null;
    }
    restTimerEnd = Date.now() + REST_DURATION * 1000;
    // Korte vibratie bij start
    vibrate(50);
    renderRestTimer();
    restTimerInterval = setInterval(() => {
      const remaining = Math.ceil((restTimerEnd - Date.now()) / 1000);
      if (remaining <= 0) {
        // 2 vibraties bij einde
        vibrate([200, 100, 200]);
        stopRestTimer(false); // false = niet door tap, dus geen extra vibration
      } else {
        renderRestTimer();
      }
    }, 250);
  }

  function stopRestTimer(byTap) {
    if (restTimerInterval) {
      clearInterval(restTimerInterval);
      restTimerInterval = null;
    }
    restTimerEnd = null;
    const host = document.getElementById('rest-timer-host');
    if (host) {
      const existing = host.querySelector('.rest-timer');
      if (existing) {
        existing.classList.add('fading');
        setTimeout(() => { if (existing.parentElement) existing.remove(); }, 250);
      }
    }
  }

  function renderRestTimer() {
    const host = document.getElementById('rest-timer-host');
    if (!host) return;
    if (!restTimerEnd) {
      host.innerHTML = '';
      return;
    }
    const remaining = Math.max(0, Math.ceil((restTimerEnd - Date.now()) / 1000));
    const mm = Math.floor(remaining / 60);
    const ss = remaining % 60;
    const display = mm > 0 ? `${mm}:${String(ss).padStart(2,'0')}` : `${ss}s`;
    const isWarning = remaining <= 10;

    let timer = host.querySelector('.rest-timer');
    if (!timer) {
      timer = document.createElement('div');
      timer.className = 'rest-timer';
      timer.setAttribute('role', 'button');
      timer.setAttribute('aria-label', 'Rust timer - tik om te stoppen');
      timer.onclick = () => stopRestTimer(true);
      host.appendChild(timer);
    }
    timer.classList.toggle('warning', isWarning);
    timer.innerHTML = `<i class="ti ti-clock"></i><span>${display}</span>`;
  }

  function getWeekDates(offset) {
    const today = new Date(TODAY);
    const dow = today.getDay();
    const monShift = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(today);
    monday.setDate(today.getDate() + monShift + offset * 7);
    const dates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      dates.push(d.toISOString().split('T')[0]);
    }
    return dates;
  }

  function renderTimelineDay(date) {
    const d = getDay(date);
    const trainType = getTrainType(date);
    const dayMigraines = migraines.filter(m => m.startTime && m.startTime.startsWith(date));

    let sleepBlocks = [];
    if (d.bedTime && d.wakeTime) {
      const [wh, wm] = d.wakeTime.split(':').map(Number);
      const [bh, bm] = d.bedTime.split(':').map(Number);
      const wakeMinutes = wh * 60 + wm;
      const bedMinutes = bh * 60 + bm;
      if (!isNaN(wakeMinutes) && wakeMinutes > 0) {
        sleepBlocks.push({ startMin: 0, endMin: wakeMinutes });
      }
      if (!isNaN(bedMinutes) && bedMinutes >= 18 * 60) {
        sleepBlocks.push({ startMin: bedMinutes, endMin: 24 * 60 });
      }
    }

    const cafTimes = [8 * 60, 11 * 60, 14 * 60, 17 * 60, 20 * 60, 9 * 60 + 30, 13 * 60, 15 * 60 + 30];

    const dayLabel = `${dn(date)} ${dnum(date)}`;
    const tags = [];
    if (trainType) {
      const cfg = TCONF[trainType];
      tags.push(`<span class="tag ${cfg.cls}">${cfg.label}</span>`);
    }
    if (dayMigraines.length > 0) {
      tags.push(`<span class="tag tmig"><i class="ti ti-alert-triangle"></i> ${dayMigraines.length}× migraine</span>`);
    }
    if ((d.caffeine_units||0) >= 4) {
      tags.push(`<span class="tag tcaf"><i class="ti ti-coffee"></i> ${d.caffeine_units}×</span>`);
    }

    let markers = '';

    sleepBlocks.forEach(b => {
      const left = (b.startMin / (24*60)) * 100;
      const w = ((b.endMin - b.startMin) / (24*60)) * 100;
      markers += `<div class="timeline-marker tl-sleep" style="left:${left}%;width:${w}%" title="Slaap"></div>`;
    });

    if (trainType) {
      const startMin = 17 * 60;
      const endMin = 18 * 60 + 30;
      const left = (startMin / (24*60)) * 100;
      const w = ((endMin - startMin) / (24*60)) * 100;
      markers += `<div class="timeline-marker tl-train" style="left:${left}%;width:${w}%" title="${TCONF[trainType].label}"></div>`;
    }

    const cafCount = Math.min(d.caffeine_units||0, cafTimes.length);
    for (let i = 0; i < cafCount; i++) {
      const left = (cafTimes[i] / (24*60)) * 100;
      markers += `<div class="timeline-marker tl-caf" style="left:${left}%;width:4px" title="Cafeïne"></div>`;
    }

    dayMigraines.forEach(m => {
      const start = new Date(m.startTime);
      const end = m.endTime ? new Date(m.endTime) : new Date(date + 'T23:59:59');
      const startMin = start.getHours() * 60 + start.getMinutes();
      let endMin;
      if (m.endTime && m.endTime.startsWith(date)) {
        endMin = end.getHours() * 60 + end.getMinutes();
      } else if (m.endTime) {
        endMin = 24 * 60;
      } else {
        endMin = 24 * 60;
      }
      const left = (startMin / (24*60)) * 100;
      const w = Math.max(2, ((endMin - startMin) / (24*60)) * 100);
      const idx = migraines.indexOf(m);
      markers += `<div class="timeline-marker tl-mig" style="left:${left}%;width:${w}%;cursor:pointer;pointer-events:auto" title="Migraine - klik voor details" onclick="showMigraineEditor(${idx})"></div>`;
    });

    return `<div class="timeline-day">
      <div class="timeline-day-header">
        <div class="timeline-day-label">${dayLabel}</div>
        <div class="timeline-day-tags">${tags.join(' ')}</div>
      </div>
      <div class="timeline-track">
        <div class="timeline-hours">${'<div class="timeline-hour"></div>'.repeat(24)}</div>
        ${markers}
      </div>
    </div>`;
  }

  function analyzeMigraineTriggers() {
    const insights = [];
    const recentMigraines = migraines
      .filter(m => m.startTime)
      .sort((a,b) => new Date(b.startTime) - new Date(a.startTime))
      .slice(0, 5);

    if (recentMigraines.length === 0) {
      insights.push({
        type: 'good',
        icon: 'ti-shield-check',
        title: 'Geen aanvallen geregistreerd',
        text: 'Begin met loggen om patronen te ontdekken. Druk op de panic button bij een aanval.'
      });
      return insights;
    }

    let waterDrops = 0, sleepShifts = 0, highCaffeine = 0, heavyTraining = 0;
    let analyzed = 0;

    recentMigraines.forEach(mig => {
      const migDate = new Date(mig.startTime);
      const day0 = mig.startTime.split('T')[0];
      const day1 = new Date(migDate.getTime() - 24*3600*1000).toISOString().split('T')[0];
      const day2 = new Date(migDate.getTime() - 48*3600*1000).toISOString().split('T')[0];

      const d0 = getDay(day0);
      const d1 = getDay(day1);
      const d2 = getDay(day2);

      if (d1.water > 0 && d2.water > 0 && d1.water < d2.water * 0.7) {
        waterDrops++;
      }

      const bed1 = bedtimeMinutesFromNoon(d1.bedTime);
      const bed2 = bedtimeMinutesFromNoon(d2.bedTime);
      if (bed1 !== null && bed2 !== null && Math.abs(bed1 - bed2) > 90) {
        sleepShifts++;
      }

      if ((d1.caffeine_units||0) >= 5 || (d2.caffeine_units||0) >= 5) {
        highCaffeine++;
      }

      const t1 = getTrainType(day1);
      if (t1 === 'lower' || t1 === 'legs' || t1 === 'pull') {
        heavyTraining++;
      }

      analyzed++;
    });

    if (analyzed === 0) return insights;

    if (waterDrops / analyzed >= 0.4) {
      insights.push({
        type: 'alert',
        icon: 'ti-droplet-off',
        title: 'Patroon: water-daling',
        text: `${waterDrops}/${analyzed} aanvallen gingen vooraf aan een dag met ≥30% minder water dan de dag ervoor. Dehydratie lijkt een trigger.`
      });
    }
    if (sleepShifts / analyzed >= 0.4) {
      insights.push({
        type: 'alert',
        icon: 'ti-clock-hour-9',
        title: 'Patroon: ritme-verschuiving',
        text: `${sleepShifts}/${analyzed} aanvallen werden voorafgegaan door een bedtijd-verschuiving van >90 minuten. Probeer een vast bedritme.`
      });
    }
    if (highCaffeine / analyzed >= 0.4) {
      insights.push({
        type: 'warn',
        icon: 'ti-coffee',
        title: 'Patroon: hoge cafeïne',
        text: `${highCaffeine}/${analyzed} aanvallen kwamen na dagen met ≥5 cafeïne-eenheden. Overweeg afbouw of consistente dosering.`
      });
    }
    if (heavyTraining / analyzed >= 0.4) {
      insights.push({
        type: 'warn',
        icon: 'ti-barbell',
        title: 'Patroon: intensieve training',
        text: `${heavyTraining}/${analyzed} aanvallen kwamen 24u na een Lower/Legs/Pull dag. Mogelijk inflammatoire respons of ontwatering.`
      });
    }

    if (insights.length === 0) {
      insights.push({
        type: 'good',
        icon: 'ti-search',
        title: 'Geen duidelijk patroon (nog)',
        text: `${recentMigraines.length} aanvallen geanalyseerd. Geen sterke 24-48u trigger gedetecteerd. Blijf data verzamelen voor scherpere inzichten.`
      });
    }

    return insights;
  }

  function rInsights() {
    const el = document.getElementById('insights');
    if (!isAppLoaded) return;

    const weekDates = getWeekDates(timelineWeekOffset);
    const weekStart = fdateShort(weekDates[0]);
    const weekEnd = fdateShort(weekDates[6]);
    const weekLabel = timelineWeekOffset === 0 ? 'Deze week' : timelineWeekOffset === -1 ? 'Vorige week' : `${weekStart} – ${weekEnd}`;
    const canGoForward = timelineWeekOffset < 0;

    const completedMigraines = migraines.filter(m => m.startTime && m.endTime);
    const thisWeekMigs = migraines.filter(m => m.startTime && weekDates.includes(m.startTime.split('T')[0]));
    const totalMeds = migraines.reduce((acc, m) => {
      (m.medicationLog||[]).forEach(med => {
        acc[med.type] = (acc[med.type]||0) + 1;
      });
      return acc;
    }, {});
    const avgDur = completedMigraines.length > 0 ?
      Math.round(completedMigraines.reduce((s,m) => s + (new Date(m.endTime) - new Date(m.startTime)), 0) / completedMigraines.length / 60000) : 0;
    const avgDurStr = avgDur < 60 ? `${avgDur}m` : `${Math.floor(avgDur/60)}u${avgDur%60}m`;

    const stats = `<div class="qstat-grid">
      <div class="qstat"><i class="ti ti-alert-triangle qicon" style="color:var(--migraine)"></i><div class="qval">${migraines.length}</div><div class="qlbl">Totaal</div></div>
      <div class="qstat"><i class="ti ti-calendar-week qicon" style="color:var(--text-2)"></i><div class="qval">${thisWeekMigs.length}</div><div class="qlbl">Deze week</div></div>
      <div class="qstat"><i class="ti ti-clock qicon" style="color:#534AB7"></i><div class="qval">${avgDur > 0 ? avgDurStr : '—'}</div><div class="qlbl">Gem. duur</div></div>
      <div class="qstat"><i class="ti ti-pill qicon" style="color:#1D9E75"></i><div class="qval">${(totalMeds.paracetamol||0)+(totalMeds.naproxen||0)+(totalMeds.sumatriptan||0)}</div><div class="qlbl">Medicatie</div></div>
    </div>`;

    const triggers = analyzeMigraineTriggers();
    const triggersH = triggers.map(t => `
      <div class="insight-card ${t.type}">
        <div class="insight-icon"><i class="ti ${t.icon}"></i></div>
        <div style="flex:1;min-width:0">
          <div class="t1" style="margin-bottom:4px">${t.title}</div>
          <div class="t3">${t.text}</div>
        </div>
      </div>
    `).join('');

    const timelineRows = weekDates.map(d => renderTimelineDay(d)).join('');
    const timelineNav = `<div class="timeline-nav">
      <button class="timeline-nav-btn" onclick="shiftTimeline(-1)">‹</button>
      <div class="timeline-nav-label">${weekLabel}<br><span class="t4" style="font-weight:500">${weekStart} – ${weekEnd}</span></div>
      <button class="timeline-nav-btn" onclick="shiftTimeline(1)" ${!canGoForward?'disabled':''}>›</button>
    </div>`;
    const legend = `<div class="timeline-legend">
      <div class="legend-item"><div class="legend-swatch" style="background:rgba(220, 38, 38, 0.7);border:1px solid #DC2626"></div> Migraine</div>
      <div class="legend-item"><div class="legend-swatch" style="background:rgba(83, 74, 183, 0.18);border-top:2px solid #534AB7;border-bottom:2px solid #534AB7"></div> Slaap</div>
      <div class="legend-item"><div class="legend-swatch" style="background:#92400E;width:6px"></div> Cafeïne</div>
      <div class="legend-item"><div class="legend-swatch" style="background:rgba(180, 122, 224, 0.25);border-top:2px solid #B47AE0;border-bottom:2px solid #B47AE0"></div> Training</div>
    </div>`;

    const sortedMigs = [...migraines].sort((a,b) => new Date(b.startTime) - new Date(a.startTime));
    const recentMigs = sortedMigs.slice(0, 5);
    const recentH = recentMigs.length === 0 ? `<p class="t3" style="text-align:center;padding:20px 0;color:var(--text-3)">Nog geen aanvallen geregistreerd</p>` :
      recentMigs.map(m => {
        const idx = migraines.indexOf(m);
        const dur = m.endTime ? Math.round((new Date(m.endTime) - new Date(m.startTime))/60000) : null;
        const durStr = dur === null ? 'actief' : dur < 60 ? `${dur} min` : `${Math.floor(dur/60)}u ${dur%60}m`;
        const meds = (m.medicationLog||[]).reduce((acc,med)=>{acc[med.type]=(acc[med.type]||0)+1;return acc;},{});
        const medStr = Object.entries(meds).map(([t,c])=>`${c}× ${t.slice(0,4)}`).join(' · ') || 'geen meds';
        return `<button class="past-mig-row" style="background:none;border:none;width:100%;cursor:pointer;font-family:var(--font-sans);text-align:left" onclick="showMigraineEditor(${idx})">
          <div style="width:8px;height:40px;background:var(--migraine);border-radius:4px;flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <div class="t3" style="font-weight:600;color:var(--text-1)">${fmtDateTime(m.startTime)}</div>
            <div class="t4" style="margin-top:2px">${durStr} · ${medStr}${m.severity?' · ernst '+m.severity+'/10':''}</div>
          </div>
          <i class="ti ti-chevron-right" style="color:var(--text-3);font-size:18px"></i>
        </button>`;
      }).join('');

    el.innerHTML = `
      <p class="sec-header" style="margin-top:8px">Inzicht & analyse</p>
      ${stats}
      <p class="sec-header">Triggers (24-48u voor aanval)</p>
      ${triggersH}
      <p class="sec-header" style="margin-top:24px">Timeline overlay</p>
      ${timelineNav}
      ${legend}
      <div class="card" style="padding:14px 16px">
        ${timelineRows}
      </div>
      <p class="sec-header" style="margin-top:24px">Recente aanvallen</p>
      <div class="card" style="padding:0 16px">${recentH}</div>
      <p class="sec-header" style="margin-top:24px">Data export</p>
      <div class="card">
        <div class="t1" style="margin-bottom:6px"><i class="ti ti-table-export"></i> Excel-export</div>
        <p class="t3" style="margin-bottom:14px">Eén platte tabel met alle dagdata, migraine-incidenten en medicatie-tijdstempels. Geschikt voor diepere analyse in Excel of Numbers.</p>
        <button class="export-btn" onclick="exportXLSX()">
          <i class="ti ti-download"></i> Download .xlsx
        </button>
      </div>
    `;
  }

  function shiftTimeline(direction) {
    const next = timelineWeekOffset + direction;
    if (next > 0) return;
    timelineWeekOffset = next;
    safe(rInsights);
  }

  // ============================================================
  // XLSX EXPORT
  // ============================================================
  function exportXLSX() {
    try {
      const allDates = new Set();
      Object.keys(daily).forEach(d => allDates.add(d));
      Object.keys(logs).forEach(d => allDates.add(d));
      migraines.forEach(m => { if(m.startTime) allDates.add(m.startTime.split('T')[0]); });
      TD.forEach(td => allDates.add(td.date));
      const sortedDates = [...allDates].sort();

      const dailyRows = sortedDates.map(date => {
        const d = getDay(date);
        const trainType = getTrainType(date);
        const sleepH = calcSleepHours(d.bedTime, d.wakeTime);
        const dayMigs = migraines.filter(m => m.startTime && m.startTime.startsWith(date));
        const medCounts = dayMigs.reduce((acc,m) => {
          (m.medicationLog||[]).forEach(med => {
            if (med.time && med.time.startsWith(date)) {
              acc[med.type] = (acc[med.type]||0) + 1;
            }
          });
          return acc;
        }, {});
        const totalSets = logs[date] ? Object.values(logs[date]).reduce((s,ex) => s + (ex.sets||[]).filter(Boolean).length, 0) : 0;

        const firstMedTime = (type) => {
          for (const m of dayMigs) {
            for (const med of (m.medicationLog||[])) {
              if (med.type === type && med.time && med.time.startsWith(date)) {
                return new Date(med.time).toTimeString().slice(0,8);
              }
            }
          }
          return '';
        };

        const migOnDate = dayMigs[0];
        const migStartTime = migOnDate ? new Date(migOnDate.startTime).toTimeString().slice(0,8) : '';
        const migEndTime = migOnDate && migOnDate.endTime ? new Date(migOnDate.endTime).toTimeString().slice(0,8) : '';

        return {
          date,
          weekday: dnL(date),
          water_ml: d.water || 0,
          water_target_ml: waterTarget(date),
          sleep_hours: sleepH || '',
          bedtime: d.bedTime || '',
          waketime: d.wakeTime || '',
          caffeine_units: d.caffeine_units || 0,
          creatine_taken: d.creat ? 1 : 0,
          run_km: d.runKm || 0,
          run_min: d.runMin || 0,
          training_type: trainType || '',
          training_sets_done: totalSets,
          migraine_active_bool: dayMigs.length > 0 ? 1 : 0,
          migraine_count: dayMigs.length,
          migraine_start_time: migStartTime,
          migraine_end_time: migEndTime,
          migraine_severity: migOnDate?.severity || '',
          paracetamol_count: medCounts.paracetamol || 0,
          paracetamol_first_time: firstMedTime('paracetamol'),
          naproxen_count: medCounts.naproxen || 0,
          naproxen_first_time: firstMedTime('naproxen'),
          sumatriptan_count: medCounts.sumatriptan || 0,
          sumatriptan_first_time: firstMedTime('sumatriptan'),
          notes: migOnDate?.notes || ''
        };
      });

      const medRows = [];
      migraines.forEach((m, mi) => {
        (m.medicationLog || []).forEach(med => {
          medRows.push({
            migraine_id: m.id || `mig_${mi}`,
            migraine_start: m.startTime || '',
            migraine_end: m.endTime || '',
            migraine_severity: m.severity || '',
            med_type: med.type,
            med_datetime: med.time || '',
            med_date: med.time ? med.time.split('T')[0] : '',
            med_time: med.time ? new Date(med.time).toTimeString().slice(0,8) : '',
            minutes_after_start: (med.time && m.startTime) ? Math.round((new Date(med.time) - new Date(m.startTime))/60000) : ''
          });
        });
      });

      const migRows = migraines.map((m, idx) => {
        const dur = m.endTime ? Math.round((new Date(m.endTime) - new Date(m.startTime))/60000) : '';
        const counts = (m.medicationLog||[]).reduce((acc,med)=>{acc[med.type]=(acc[med.type]||0)+1;return acc;},{});
        return {
          migraine_id: m.id || `mig_${idx}`,
          start_datetime: m.startTime || '',
          end_datetime: m.endTime || '',
          start_date: m.startTime ? m.startTime.split('T')[0] : '',
          start_time: m.startTime ? new Date(m.startTime).toTimeString().slice(0,8) : '',
          duration_minutes: dur,
          severity: m.severity || '',
          paracetamol_count: counts.paracetamol || 0,
          naproxen_count: counts.naproxen || 0,
          sumatriptan_count: counts.sumatriptan || 0,
          total_med_count: (m.medicationLog||[]).length,
          notes: m.notes || ''
        };
      });

      const trainRows = [];
      Object.entries(logs).forEach(([date, exMap]) => {
        const trainType = getTrainType(date);
        Object.entries(exMap).forEach(([exId, exLog]) => {
          const exDef = trainType ? EX[trainType]?.find(e => e.id === exId) : null;
          trainRows.push({
            date,
            weekday: dnL(date),
            training_type: trainType || '',
            exercise_id: exId,
            exercise_name: exDef?.n || exId,
            muscle: exDef?.m || '',
            target_sets: exDef?.sets || '',
            target_reps: exDef?.reps || '',
            sets_completed: (exLog.sets||[]).filter(Boolean).length,
            weight: exLog.weight || 0,
            unit: exDef?.u || ''
          });
        });
      });

      const wb = XLSX.utils.book_new();

      const ws1 = XLSX.utils.json_to_sheet(dailyRows);
      ws1['!cols'] = Object.keys(dailyRows[0] || {}).map(k => ({ wch: Math.max(12, k.length + 2) }));
      XLSX.utils.book_append_sheet(wb, ws1, 'Daily');

      const ws2 = XLSX.utils.json_to_sheet(migRows);
      if (migRows.length > 0) ws2['!cols'] = Object.keys(migRows[0]).map(k => ({ wch: Math.max(12, k.length + 2) }));
      XLSX.utils.book_append_sheet(wb, ws2, 'Migraines');

      const ws3 = XLSX.utils.json_to_sheet(medRows);
      if (medRows.length > 0) ws3['!cols'] = Object.keys(medRows[0]).map(k => ({ wch: Math.max(12, k.length + 2) }));
      XLSX.utils.book_append_sheet(wb, ws3, 'Medicatie');

      const ws4 = XLSX.utils.json_to_sheet(trainRows);
      if (trainRows.length > 0) ws4['!cols'] = Object.keys(trainRows[0]).map(k => ({ wch: Math.max(12, k.length + 2) }));
      XLSX.utils.book_append_sheet(wb, ws4, 'Training');

      const stamp = new Date().toISOString().split('T')[0];
      XLSX.writeFile(wb, `lifestyle-export-${stamp}.xlsx`);
    } catch (e) {
      console.error(e);
      alert('Export mislukt: ' + e.message);
    }
  }

  // ============================================================
  // EXPOSE FUNCTIES
  // ============================================================
  window.switchTab = switchTab;
  window.adjW = adjW;
  window.updSleep = updSleep;
  window.adjCaf = adjCaf;
  window.tgCreat = tgCreat;
  window.updR = updR;
  window.goToTraining = goToTraining;
  window.tgAv = tgAv;
  window.selD = selD;
  window.tgEx = tgEx;
  window.tgSet = tgSet;
  window.adjEW = adjEW;
  window.saveSess = saveSess;
  window.svDay = svDay;
  window.tgMl = tgMl;
  window.tgCup = tgCup;
  window.setVoedingSub = setVoedingSub;
  window.tgSh = tgSh;
  window.startMigraine = startMigraine;
  window.addMed = addMed;
  window.endMigraine = endMigraine;
  window.viewMigraineDetail = viewMigraineDetail;
  window.showMigraineEditor = showMigraineEditor;
  window.closeEditor = closeEditor;
  window.saveMigraineEdits = saveMigraineEdits;
  window.deleteMigraine = deleteMigraine;
  window.addMedTo = addMedTo;
  window.updateMedTime = updateMedTime;
  window.delMed = delMed;
  window.shiftTimeline = shiftTimeline;
  window.exportXLSX = exportXLSX;

</script>
