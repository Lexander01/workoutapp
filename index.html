<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Summer Body 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --color-background-primary: #ffffff;
      --color-background-secondary: #f4f5f7;
      --color-border-primary: #d1d5db;
      --color-border-secondary: #e5e7eb;
      --color-border-tertiary: #f3f4f6;
      --color-text-primary: #111827;
      --color-text-secondary: #4b5563;
      --color-text-tertiary: #9ca3af;
      --border-radius-md: 8px;
      --border-radius-lg: 12px;
    }
    
    body {
      background-color: #e5e7eb;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    .app{width:100%;max-width:680px;min-height:100vh;background:var(--color-background-primary);font-family:var(--font-sans);box-shadow:0 0 20px rgba(0,0,0,0.05)}
    .tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);gap:2px;position:sticky;top:0;background:var(--color-background-primary);z-index:10;padding:0.5rem 0.5rem 0}
    .tb{flex:1;padding:12px 2px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:var(--font-sans);font-size:11px;font-weight:500;color:var(--color-text-secondary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
    .tb.on{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
    .tb i{font-size:20px}
    .sec{display:none;padding:1rem}
    .sec.on{display:block}
    .card{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:.75rem}
    .card-s{background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:.75rem 1rem;margin-bottom:.75rem}
    .t1{font-size:15px;font-weight:600;color:var(--color-text-primary)}
    .t2{font-size:13px;color:var(--color-text-secondary)}
    .t3{font-size:12px;color:var(--color-text-secondary)}
    .t4{font-size:11px;color:var(--color-text-tertiary)}
    .nbig{font-size:22px;font-weight:600;color:var(--color-text-primary)}
    .bet{display:flex;align-items:center;justify-content:space-between}
    .row{display:flex;align-items:center;gap:8px}
    .tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;gap:4px}
    .tp{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
    .tl{background:#E6F1FB;color:#0C447C;border:1px solid #85B7EB}
    .tg{background:#FAEEDA;color:#633806;border:1px solid #EF9F27}
    .tr{background:#EEEDFE;color:#3C3489;border:1px solid #AFA9EC}
    .tcup{background:#FBEAF0;color:#72243E;border:1px solid #ED93B1}
    .pill{padding:6px 12px;border-radius:20px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);cursor:pointer;font-size:12px;font-weight:500;font-family:var(--font-sans);color:var(--color-text-secondary);white-space:nowrap}
    .pill.ap{background:#E1F5EE;border-color:#5DCAA5;color:#085041}
    .pill.ab{background:#E6F1FB;border-color:#85B7EB;color:#0C447C}
    .pill.aa{background:#FAEEDA;border-color:#EF9F27;color:#633806}
    .pill.ac{background:var(--color-text-primary);border-color:var(--color-text-primary);color:var(--color-background-primary)}
    .dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-bottom:1.25rem}
    .dbtn{background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:10px 4px;cursor:pointer;text-align:center;font-family:var(--font-sans);width:100%}
    .dbtn:hover{border-color:var(--color-border-primary)}
    .dbtn.off{opacity:.4}
    .dbtn.tdy{border:2px solid var(--color-text-primary)}
    .srow{display:flex;gap:6px}
    .sbtn{flex:1;height:44px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);cursor:pointer;font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--color-text-secondary)}
    .sbtn.done{background:#E1F5EE;border-color:#5DCAA5;color:#085041}
    .wctrl{display:flex;align-items:center;gap:12px}
    .wbtn{width:40px;height:40px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);cursor:pointer;font-size:20px;color:var(--color-text-primary);font-family:var(--font-sans);font-weight:500}
    .wval{flex:1;text-align:center;font-size:18px;font-weight:600;color:var(--color-text-primary)}
    .ptrack{height:8px;background:var(--color-background-secondary);border-radius:4px;overflow:hidden;margin-top:10px}
    .pfill{height:100%;border-radius:4px;transition:width .3s}
    .shbtn{display:flex;align-items:center;gap:12px;padding:12px 0;border:none;border-bottom:1px solid var(--color-border-secondary);background:none;width:100%;cursor:pointer;font-family:var(--font-sans)}
    .shbtn.dn{opacity:.4}
    .cb{width:26px;height:26px;border-radius:6px;border:1px solid var(--color-border-primary);background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .cb.on{background:#E1F5EE;border-color:#5DCAA5;color:#085041}
    .exacc{border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);margin-bottom:10px;overflow:hidden}
    .exhdr{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;background:none;border:none;width:100%;font-family:var(--font-sans);text-align:left}
    .exhdr:hover{background:var(--color-background-secondary)}
    .exbdy{padding:0 14px 14px;border-top:1px solid var(--color-border-secondary)}
    .tipbox{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px;font-size:13px;color:var(--color-text-secondary);margin:12px 0;line-height:1.4}
    .mlacc{border-bottom:1px solid var(--color-border-secondary)}
    .mlhdr{display:flex;align-items:center;padding:14px 0;cursor:pointer;background:none;border:none;width:100%;font-family:var(--font-sans);gap:12px;text-align:left}
    .mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
    .mbox{text-align:center;background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:12px 4px}
    .stepn{width:24px;height:24px;border-radius:50%;background:var(--color-background-primary);border:1px solid var(--color-border-primary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--color-text-primary);flex-shrink:0;margin-top:2px}
    .savbtn{width:100%;padding:14px;background:var(--color-text-primary);border:none;border-radius:var(--border-radius-lg);cursor:pointer;font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--color-background-primary);margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:8px}
    .savbtn.sv{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
    .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem}
    .qstat{background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:12px 8px;text-align:center}
    .qstat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1.25rem}
    .qicon{font-size:22px;color:var(--color-text-secondary);margin-bottom:6px}
    .qval{font-size:16px;font-weight:600;color:var(--color-text-primary)}
    .qlbl{font-size:10px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
    .streak-row{display:grid;grid-template-columns:60px repeat(7,1fr);gap:4px;align-items:center;margin-bottom:8px}
    .streak-cell{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
    .streak-on{background:#E1F5EE;color:#085041}
    .streak-off{background:var(--color-background-secondary);color:var(--color-text-tertiary)}
    .streak-today{outline:2px solid var(--color-text-primary);outline-offset:1px}
    .run-input{width:100%;height:40px;padding:0 12px;border:1px solid var(--color-border-primary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);font-family:var(--font-sans);font-size:14px;color:var(--color-text-primary)}
    .toggle-card{cursor:pointer;background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:.75rem;width:100%;text-align:left;font-family:var(--font-sans)}
    .toggle-card.on{background:#E1F5EE;border-color:#5DCAA5}
    .cup-card{background:#FBEAF0;border:1px solid #ED93B1;border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:.75rem}
    .cup-section{padding:14px;background:var(--color-background-primary);border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);margin-top:10px}
  </style>
</head>

  function gw(id){if(weights[id]!==undefined)return weights[id];for(const k of Object.keys(EX)){const e=EX[k].find(e=>e.id===id);if(e)return e.w}return 0}
  function nxtW(cur,done,target,compound){if(done>=target)return Math.round((cur+(compound?2.5:1.25))*4)/4;if(done>=Math.ceil(target*.75))return cur;return Math.round((cur*.95)*4)/4}
  function isAv(d){return avail[d]!==false}
  function isTrainDay(d){return!!TD.find(td=>td.date===d&&isAv(td.date))}
  function waterTarget(d){return isTrainDay(d)?3500:3000}
  function getDay(d){return daily[d]||{water:0,sleep:0,creat:false,runKm:0,runMin:0}}

  async function loadAll(){
    try{
      const[a,w,l,s,d]=await Promise.all([sget('avail'),sget('weights'),sget('logs'),sget('shop'),sget('daily')])
      if(a)avail=a;if(w)weights=w;if(l)logs=l;if(s)shopCk=s;if(d)daily=d
    }catch{}
  }

  function switchTab(tab){
    document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===tab))
    if(tab==='vandaag')safe(rVandaag)
    if(tab==='schema')safe(rSchema)
    if(tab==='training')safe(rTraining)
    if(tab==='voeding')safe(rVoeding)
    if(tab==='shop')safe(rShop)
  }
  function safe(fn){try{fn()}catch(e){console.error(e)}}

  function dn(d){return['Zo','Ma','Di','Wo','Do','Vr','Za'][new Date(d).getDay()]}
  function dnL(d){return['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'][new Date(d).getDay()]}
  function dnum(d){return new Date(d).getDate()}
  function fdate(str){const d=new Date(str);const mn=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];return`${dnL(str)} ${d.getDate()} ${mn[d.getMonth()]}`}

        ${runDone?`<span class="tag" style="background:#FAECE7;color:#993C1D;border:1px solid #F0997B"><i class="ti ti-check"></i> ${d.runKm}km</span>`:''}

        <div><div class="t4" style="margin-bottom:6px">Tijd (min)</div><input class="run-input" type="number" min="0" step="1" value="${d.runMin||''}" placeholder="0" onchange="updR('runMin',this.value)" /></div>

    const last7=[]
    const tD=new Date(t)
    for(let i=6;i>=0;i--){const dt=new Date(tD);dt.setDate(tD.getDate()-i);const ds=dt.toISOString().split('T')[0],dd=getDay(ds),wT=waterTarget(ds);last7.push({date:ds,day:dn(ds),water:dd.water>=wT*.85,sleep:dd.sleep>=7,creat:dd.creat,run:dd.runKm>0||dd.runMin>0})}
    function streakRow(label,key,icon,color){return`<div class="streak-row">
      <div class="t3" style="display:flex;align-items:center;gap:6px"><i class="ti ${icon}" style="color:${color};font-size:16px"></i> ${label}</div>
      ${last7.map(d=>`<div class="streak-cell ${d[key]?'streak-on':'streak-off'}${d.date===TODAY?' streak-today':''}" title="${d.day}">${d[key]?'✓':''}</div>`).join('')}
    </div>`}
    const streaks=`<div class="card">
      <div class="t1" style="margin-bottom:16px">Laatste 7 dagen</div>
      <div class="streak-row" style="margin-bottom:8px"><div></div>${last7.map(d=>`<div class="t4" style="text-align:center">${d.day}</div>`).join('')}</div>
      ${streakRow('Water','water','ti-droplet','#185FA5')}
      ${streakRow('Slaap','sleep','ti-moon','#534AB7')}
      ${streakRow('Creatine','creat','ti-pill','#1D9E75')}
      ${streakRow('Run','run','ti-run','#D85A30')}
    </div>`
    el.innerHTML=`
      <div class="card-s" style="margin-bottom:1.25rem">
        <div class="t4" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${dnL(t).toLowerCase()}</div>
        <div style="font-size:20px;font-weight:600;color:var(--color-text-primary)">${fdate(t)}</div>
      </div>
      ${tdyCard}${qs}${water}${sleep}${creat}${run}${streaks}`
  }

  async function adjW(delta){const t=TODAY;daily[t]=daily[t]||{water:0,sleep:0,creat:false,runKm:0,runMin:0};daily[t].water=Math.max(0,(daily[t].water||0)+delta);await sset('daily',daily);safe(rVandaag)}
  async function adjS(delta){const t=TODAY;daily[t]=daily[t]||{water:0,sleep:0,creat:false,runKm:0,runMin:0};daily[t].sleep=Math.max(0,Math.min(12,Math.round(((daily[t].sleep||0)+delta)*2)/2));await sset('daily',daily);safe(rVandaag)}
  async function tgCreat(){const t=TODAY;daily[t]=daily[t]||{water:0,sleep:0,creat:false,runKm:0,runMin:0};daily[t].creat=!daily[t].creat;await sset('daily',daily);safe(rVandaag)}
  async function updR(field,val){const t=TODAY;daily[t]=daily[t]||{water:0,sleep:0,creat:false,runKm:0,runMin:0};daily[t][field]=parseFloat(val)||0;await sset('daily',daily);safe(rVandaag)}
  function goToTraining(d){selDate=d;sLog={};expEx=null;ssSaved=false;switchTab('training')}

  function rSchema(){
    const el=document.getElementById('schema')
    const cnt={push:0,pull:0,legs:0}
    TD.forEach(d=>{if(isAv(d.date))cnt[d.type]++})

      <div class="dgrid">${days.map(d=>{const cfg=TCONF[d.type],av=isAv(d.date),isT=d.date===TODAY,hl=logs[d.date]&&Object.keys(logs[d.date]).length>0
        return`<button class="dbtn${av?'':' off'}${isT?' tdy':''}" onclick="tgAv('${d.date}')">

          <span style="font-size:18px;font-weight:600;color:var(--color-text-primary);display:block;margin:2px 0">${dnum(d.date)}</span>
          <span class="tag ${cfg.cls}" style="margin-top:4px;display:inline-block;font-size:10px">${cfg.label}</span>

          ${!av?'<br><span style="font-size:10px;color:var(--color-text-tertiary);font-weight:500;display:block;margin-top:4px">vrij</span>':''}
        </button>`}).join('')}</div>`}
    el.innerHTML=`
      <div class="statgrid">
        ${['push','pull','legs'].map(t=>{const cfg=TCONF[t]
          return`<div class="card" style="padding:.75rem 1rem;border-left:4px solid ${cfg.col}"><div class="nbig">${cnt[t]}×</div><div class="t4" style="margin-top:2px">${cfg.label} sessies</div></div>`}).join('')}
      </div>
      <p class="t4" style="margin-bottom:1.5rem"><i class="ti ti-hand-click"></i> Tik op een dag om vrij te plannen of te herstellen</p>
      ${mth(may,'Mei 2026')}${mth(jun,'Juni 2026')}
      <div class="card-s">
        <p class="t3" style="font-weight:600;margin-bottom:10px">Profiel & doelen</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px">
          ${[['Gewicht','92 kg'],['Lengte','191 cm'],['Doel','Recompositie'],['Kcal/dag','~2.400'],['Eiwit/dag','~185 g'],['Water/dag','3-3,5L'],['Slaap','7-8 uur'],['Creatine','5g/dag'],['Hardlopen','1×/wknd'],['Periode','7 weken']].map(([k,v])=>`<p class="t3">${k}: <strong>${v}</strong></p>`).join('')}
        </div>
      </div>`
  }
  async function tgAv(date){if(avail[date]===false)delete avail[date];else avail[date]=false;await sset('avail',avail);safe(rSchema)}

  function rTraining(){
    const el=document.getElementById('training')
    const avDays=TD.filter(d=>isAv(d.date))
    if(!selDate)selDate=avDays.find(d=>d.date>=TODAY)?.date||avDays[0]?.date
    const day=TD.find(d=>d.date===selDate)
    const pillsH=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;overflow-x:auto;padding-bottom:8px">
      ${avDays.map(d=>{const cfg=TCONF[d.type],ia=d.date===selDate,hl=logs[d.date]&&Object.keys(logs[d.date]).length>0
        return`<button class="pill${ia?' '+cfg.pill:''}" onclick="selD('${d.date}')">${dnum(d.date)}/${new Date(d.date).getMonth()+1}${hl?'✓':''}</button>`}).join('')}
    </div>`
    if(!day){el.innerHTML=pillsH+'<p class="t2">Selecteer een trainingssessie hierboven.</p>';return}
    const cfg=TCONF[day.type],exs=EX[day.type]
    if(!sLog._date||sLog._date!==selDate){sLog={_date:selDate};exs.forEach(ex=>{sLog[ex.id]=logs[selDate]?.[ex.id]||{sets:Array(ex.sets).fill(false),weight:gw(ex.id)}})}
    const exH=exs.map((ex,i)=>{const lg=sLog[ex.id],dnC=lg.sets.filter(Boolean).length,allD=dnC===ex.sets,isE=expEx===ex.id
      const wshow=ex.u==='sec'?lg.weight+'s':lg.weight+' '+(ex.u==='kg/hand'?'kg/h':'kg')
      return`<div class="exacc">

          <div style="width:30px;height:30px;border-radius:50%;background:${allD?'#E1F5EE':'var(--color-background-secondary)'};border:1px solid ${allD?'#5DCAA5':'var(--color-border-primary)'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:${allD?'#085041':'var(--color-text-secondary)'};flex-shrink:0">${allD?'<i class="ti ti-check"></i>':i+1}</div>
          <div style="flex:1"><div class="t1">${ex.n}</div><div class="t4" style="margin-top:2px">${ex.m}</div></div>
          <div style="text-align:right;margin-right:10px"><div class="t3" style="font-weight:600">${ex.sets}×${ex.reps}${ex.u==='sec'?'s':' reps'} @ ${wshow}</div><div class="t4" style="margin-top:2px">${dnC}/${ex.sets} sets</div></div>
          <i class="ti ti-chevron-${isE?'up':'down'}" style="font-size:16px;color:var(--color-text-tertiary)"></i>
        </button>
        ${isE?`<div class="exbdy">
          <div class="tipbox"><i class="ti ti-bulb"></i> ${ex.tip}</div>
          ${ex.u!=='sec'?`<p class="t4" style="margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:.5px">Gewicht aanpassen</p>
          <div class="wctrl" style="margin-bottom:16px">
            <button class="wbtn" onclick="adjEW('${ex.id}',${ex.c?-2.5:-1.25})">−</button>
            <div class="wval">${lg.weight} <span class="t4">${ex.u==='kg/hand'?'kg/hand':'kg'}</span></div>
            <button class="wbtn" onclick="adjEW('${ex.id}',${ex.c?2.5:1.25})">+</button>
          </div>`:''}
          <p class="t4" style="margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:.5px">Sets afvinken</p>
          <div class="srow">${lg.sets.map((done,si)=>`<button class="sbtn${done?' done':''}" onclick="tgSet('${ex.id}',${si})">${done?'<i class="ti ti-check"></i>':si+1}</button>`).join('')}</div>
        </div>`:''}
      </div>`}).join('')
    let nwH=''
    if(ssSaved){nwH=`<div class="card" style="margin-top:1rem">
      <p class="t3" style="font-weight:600;margin-bottom:12px"><i class="ti ti-trending-up" style="color:#1D9E75"></i> Volgende sessie (berekend gewicht)</p>
      ${exs.map(ex=>{const lg=sLog[ex.id],done=lg.sets.filter(Boolean).length,cur=lg.weight,nxt=nxtW(cur,done,ex.sets,ex.c),diff=Math.round((nxt-cur)*4)/4
        return`<div class="bet" style="padding:8px 0;border-bottom:1px solid var(--color-border-tertiary)">

        </div>`}).join('')}</div>`}
    el.innerHTML=pillsH+`
      <div class="card" style="margin-bottom:1.25rem;border-left:4px solid ${cfg.col}">
        <div class="bet">
          <div><span class="tag ${cfg.cls}" style="margin-bottom:8px;display:inline-block">${cfg.label} day</span><div class="t2" style="font-weight:500">${fdate(selDate)}</div><div class="t4" style="margin-top:2px">${cfg.muscles}</div></div>

        <i class="ti ti-${ssSaved?'check':'device-floppy'}"></i>
        ${ssSaved?'Sessie opgeslagen':'Sessie opslaan + evalueren'}
      </button>${nwH}`
  }
  function selD(d){selDate=d;sLog={};expEx=null;ssSaved=false;safe(rTraining)}
  function tgEx(id){expEx=expEx===id?null:id;safe(rTraining)}
  function tgSet(id,si){sLog[id].sets[si]=!sLog[id].sets[si];safe(rTraining)}
  function adjEW(id,delta){sLog[id].weight=Math.max(0,Math.round((sLog[id].weight+delta)*4)/4);safe(rTraining)}
  async function saveSess(){
    const day=TD.find(d=>d.date===selDate);if(!day)return
    const exs=EX[day.type],nL={...logs,[selDate]:{...(logs[selDate]||{})}},nW={...weights}
    for(const[id,lg]of Object.entries(sLog)){if(id==='_date')continue;const ex=exs.find(e=>e.id===id);if(!ex)continue;nL[selDate][id]=lg;nW[id]=nxtW(lg.weight,lg.sets.filter(Boolean).length,ex.sets,ex.c)}
    logs=nL;weights=nW;ssSaved=true
    await Promise.all([sset('logs',logs),sset('weights',weights)])
    safe(rTraining)
  }

    const cupH=CUP_RECIPES.map((r,i)=>{const isE=expCup===i
      return`<div class="mlacc" style="border-color:#ED93B1">

          <div style="text-align:right;margin-right:10px"><div class="t3" style="font-weight:600">${r.k} kcal</div><div class="t4" style="margin-top:2px">${r.p}g eiwit</div></div>
          <i class="ti ti-chevron-${isE?'up':'down'}" style="font-size:16px;color:var(--color-text-tertiary)"></i>
        </button>
        ${isE?`<div style="padding:0 0 16px">
          <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
            <span style="background:#E6F1FB;border:1px solid #85B7EB;color:#0C447C;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500">E: ${r.p}g</span>
            <span style="background:#FAEEDA;border:1px solid #EF9F27;color:#633806;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500">K: ${r.c}g</span>

          <div class="tipbox" style="margin-top:12px"><i class="ti ti-bulb"></i> ${r.tip}</div>
        </div>`:''}

    el.innerHTML=`
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;padding-bottom:4px;overflow-x:auto">${MEALS.map((m,i)=>`<button class="pill${vDay===i?' ac':''}" onclick="svDay(${i})">${m.day.slice(0,2)}</button>`).join('')}</div>
      <div class="mgrid">${mc.map(m=>`<div class="mbox"><div style="font-size:20px;font-weight:600;color:${m.c}">${m.v}</div><div class="t4" style="margin-top:2px">${m.l}</div></div>`).join('')}</div>
      <div class="card" style="padding:0 1.25rem">${mlH}</div>
      <div class="cup-card">
        <div class="bet" style="margin-bottom:12px">
          <div class="t1"><i class="ti ti-cup" style="color:#993556"></i> Cup recepten</div>
          <span class="tag tcup">4 opties</span>

        <p class="t3" style="margin-bottom:8px;line-height:1.4">Voor je cup met apart deksel-compartiment. Werkwijze: <strong>zuivel onderin</strong>, <strong>droge topping in het deksel</strong>. Mix vlak voor het eten.</p>

  }
  function svDay(i){vDay=i;expMeal=null;safe(rVoeding)}
  function tgMl(k){expMeal=expMeal===k?null:k;safe(rVoeding)}
