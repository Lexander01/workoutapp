<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Summer Body 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --bg-page: #f0f1f4;
      --bg-card: #ffffff;
      --bg-soft: #f4f5f7;
      --bg-softer: #fafafb;
      --border: #e5e7eb;
      --border-soft: #eef0f2;
      --text-1: #111827;
      --text-2: #4b5563;
      --text-3: #9ca3af;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 2px rgba(17,24,39,0.04), 0 1px 1px rgba(17,24,39,0.02);
      --shadow-md: 0 4px 12px rgba(17,24,39,0.06);
      --shadow-lg: 0 10px 30px rgba(17,24,39,0.08);
      --accent-push: #5DCAA5;
      --accent-pull: #85B7EB;
      --accent-legs: #EF9F27;
      --accent-upper: #B47AE0;
      --accent-lower: #F08A6B;
      --tabbar-h: 68px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

    html, body {
      height: 100%;
      background-color: var(--bg-page);
      overscroll-behavior: contain;
    }

    body {
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      font-family: var(--font-sans);
      color: var(--text-1);
      font-size: 15px;
      line-height: 1.5;
      touch-action: manipulation;
    }

    /* Disable text selection on UI chrome but allow on content */
    button, .pill, .tb {
      -webkit-user-select: none;
      user-select: none;
    }

    .app{
      width:100%;
      max-width:680px;
      min-height:100vh;
      min-height:100dvh;
      background:var(--bg-card);
      box-shadow:0 0 40px rgba(17,24,39,0.06);
      display:flex;
      flex-direction:column;
      position:relative;
    }

    /* ── Top sticky date strip (Vandaag only) ─────────────────────────────────── */
    .top-strip {
      position: sticky;
      top: 0;
      background: rgba(255,255,255,0.95);
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      padding: calc(var(--safe-top) + 14px) 20px 14px;
      z-index: 5;
      border-bottom: 1px solid transparent;
      transition: border-color .2s ease;
    }
    .top-strip.scrolled {
      border-bottom-color: var(--border-soft);
    }
    .top-strip-eyebrow {
      font-size: 11px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: .8px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .top-strip-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    /* ── Sections ─────────────────────────────────────── */
    .sec {
      display: none;
      flex: 1;
      padding: 16px 16px calc(var(--tabbar-h) + var(--safe-bottom) + 24px);
      animation: fadeIn .18s ease;
    }
    .sec.on { display: block; }
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

    /* ── Bottom tab bar (mobile-first, iOS/Android style) ─────────────────── */
    .tabs{
      position:fixed;
      bottom:0; left:0; right:0;
      z-index:20;
      display:flex;
      gap:0;
      background:rgba(255,255,255,0.96);
      backdrop-filter:saturate(180%) blur(20px);
      -webkit-backdrop-filter:saturate(180%) blur(20px);
      border-top:1px solid var(--border);
      padding: 6px 4px calc(var(--safe-bottom) + 6px);
      max-width:680px;
      margin:0 auto;
    }
    .tb{
      flex:1;
      padding:10px 4px 8px;
      background:none;
      border:none;
      cursor:pointer;
      font-family:var(--font-sans);
      font-size:10.5px;
      font-weight:500;
      color:var(--text-3);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      position:relative;
      min-height:48px;
      transition:color .12s ease, transform .1s ease;
    }
    .tb i{font-size:22px;line-height:1}
    .tb.on{color:var(--text-1);font-weight:600}
    .tb.on i {
      transform: scale(1.05);
      transition: transform .15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tb:active{transform:scale(0.94)}

    /* ── Cards ─────────────────────────────────────── */
    .card{
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      padding:16px 18px;
      margin-bottom:12px;
      box-shadow:var(--shadow-sm);
    }
    .card-soft{
      background:var(--bg-soft);
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      padding:14px 16px;
      margin-bottom:12px;
    }
    .card-feature{
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:18px 20px 18px 22px;
      margin-bottom:14px;
      box-shadow:var(--shadow-md);
      position:relative;
      overflow:hidden;
    }

    /* Tappable cards get pressed-state feedback */
    button.card, button.card-feature, .toggle-card {
      transition: transform .1s ease, box-shadow .15s ease, border-color .15s ease;
    }
    button.card:active, button.card-feature:active, .toggle-card:active {
      transform: scale(0.985);
    }

    /* ── Type ─────────────────────────────────────── */
    .h-eyebrow{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;font-weight:600;margin-bottom:8px}
    .t1{font-size:16px;font-weight:600;color:var(--text-1);line-height:1.35}
    .t2{font-size:14px;color:var(--text-2);line-height:1.45}
    .t3{font-size:13px;color:var(--text-2);line-height:1.45}
    .t4{font-size:12px;color:var(--text-3);line-height:1.4}
    .nbig{font-size:26px;font-weight:700;color:var(--text-1);letter-spacing:-0.02em;line-height:1}
    .nmed{font-size:20px;font-weight:600;color:var(--text-1);letter-spacing:-0.01em}
    .bet{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .row{display:flex;align-items:center;gap:8px}

    /* ── Tags ─────────────────────────────────────── */
    .tag{display:inline-flex;align-items:center;padding:4px 9px;border-radius:7px;font-size:11px;font-weight:600;gap:4px;letter-spacing:.2px}
    .tp{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5}
    .tl{background:#E6F1FB;color:#0C447C;border:1px solid #85B7EB}
    .tg{background:#FAEEDA;color:#633806;border:1px solid #EF9F27}
    .tu{background:#F1E8FB;color:#4A1F73;border:1px solid #B47AE0}
    .tlw{background:#FBE7DF;color:#7B2D14;border:1px solid #F08A6B}
    .tr{background:#EEEDFE;color:#3C3489;border:1px solid #AFA9EC}
    .tcup{background:#FBEAF0;color:#72243E;border:1px solid #ED93B1}

    /* ── Pills ─────────────────────────────────────── */
    .pill{
      padding:9px 15px;
      border-radius:22px;
      border:1px solid var(--border);
      background:var(--bg-card);
      cursor:pointer;
      font-size:12.5px;
      font-weight:500;
      font-family:var(--font-sans);
      color:var(--text-2);
      white-space:nowrap;
      min-height:36px;
      transition:all .12s ease;
    }
    .pill:active{transform:scale(0.95)}
    .pill.ap{background:#E1F5EE;border-color:#5DCAA5;color:#085041;font-weight:600}
    .pill.ab{background:#E6F1FB;border-color:#85B7EB;color:#0C447C;font-weight:600}
    .pill.aa{background:#FAEEDA;border-color:#EF9F27;color:#633806;font-weight:600}
    .pill.au{background:#F1E8FB;border-color:#B47AE0;color:#4A1F73;font-weight:600}
    .pill.alw{background:#FBE7DF;border-color:#F08A6B;color:#7B2D14;font-weight:600}
    .pill.ac{background:var(--text-1);border-color:var(--text-1);color:#fff;font-weight:600}

    /* ── Schema day grid ─────────────────────────────────────── */
    .dgrid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
      gap:8px;
      margin-bottom:20px;
    }
    .dbtn{
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      padding:10px 4px;
      cursor:pointer;
      text-align:center;
      font-family:var(--font-sans);
      width:100%;
      min-height:74px;
      transition:all .12s ease;
    }
    .dbtn:active{transform:scale(0.95)}
    .dbtn.off{opacity:.4}
    .dbtn.tdy{border:2px solid var(--text-1);box-shadow:0 0 0 3px rgba(17,24,39,0.06)}

    /* ── Sets / weight controls ─────────────────────────────────────── */
    .srow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .srow.s3{grid-template-columns:repeat(3,1fr)}
    .sbtn{
      height:54px;
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      background:var(--bg-soft);
      cursor:pointer;
      font-family:var(--font-sans);
      font-size:15px;
      font-weight:600;
      color:var(--text-2);
      transition:all .1s ease;
    }
    .sbtn:active{transform:scale(0.93);background:var(--bg-card)}
    .sbtn.done{background:#E1F5EE;border-color:#5DCAA5;color:#085041}

    .wctrl{display:flex;align-items:center;gap:14px}
    .wbtn{
      width:52px; height:52px;
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      background:var(--bg-soft);
      cursor:pointer;
      font-size:24px;
      color:var(--text-1);
      font-family:var(--font-sans);
      font-weight:500;
      transition:all .1s ease;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .wbtn:active{transform:scale(0.92);background:var(--bg-card)}
    .wval{flex:1;text-align:center;font-size:20px;font-weight:600;color:var(--text-1);letter-spacing:-0.01em}

    /* ── Progress ─────────────────────────────────────── */
    .ptrack{height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden;margin-top:12px}
    .pfill{height:100%;border-radius:4px;transition:width .3s ease}

    /* ── Shop list ─────────────────────────────────────── */
    .shbtn{
      display:flex;
      align-items:center;
      gap:14px;
      padding:14px 0;
      border:none;
      border-bottom:1px solid var(--border-soft);
      background:none;
      width:100%;
      cursor:pointer;
      font-family:var(--font-sans);
      transition:opacity .15s ease;
      min-height:56px;
    }
    .shbtn:last-child{border-bottom:none}
    .shbtn:active{opacity:0.6}
    .shbtn.dn{opacity:.45}
    .cb{
      width:26px; height:26px;
      border-radius:7px;
      border:1.5px solid #cdd1d8;
      background:var(--bg-card);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      transition:all .12s ease;
    }
    .cb.on{background:#E1F5EE;border-color:#5DCAA5;color:#085041}

    /* ── Accordions ─────────────────────────────────────── */
    .exacc{
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      margin-bottom:10px;
      overflow:hidden;
      background:var(--bg-card);
    }
    .exhdr{
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px 14px;
      cursor:pointer;
      background:none;
      border:none;
      width:100%;
      font-family:var(--font-sans);
      text-align:left;
      transition:background .12s ease;
      min-height:64px;
    }
    .exhdr:active{background:var(--bg-soft)}
    .exbdy{padding:6px 16px 18px;border-top:1px solid var(--border-soft);background:var(--bg-softer)}
    .tipbox{
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      padding:14px;
      font-size:13.5px;
      color:var(--text-2);
      margin:14px 0;
      line-height:1.5;
      display:flex;
      gap:10px;
    }
    .tipbox i{color:#EF9F27;flex-shrink:0;margin-top:2px;font-size:18px}

    .mlacc{border-bottom:1px solid var(--border-soft)}
    .mlacc:last-child{border-bottom:none}
    .mlhdr{
      display:flex;
      align-items:center;
      padding:16px 0;
      cursor:pointer;
      background:none;
      border:none;
      width:100%;
      font-family:var(--font-sans);
      gap:12px;
      text-align:left;
      min-height:64px;
    }
    .mlhdr:active{opacity:0.7}

    /* ── Macro grid ─────────────────────────────────────── */
    .mgrid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
      margin-bottom:18px;
    }
    .mbox{
      text-align:center;
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      padding:14px 4px;
      box-shadow:var(--shadow-sm);
    }

    .stepn{
      width:26px; height:26px;
      border-radius:50%;
      background:var(--bg-card);
      border:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:600;
      color:var(--text-1);
      flex-shrink:0;
      margin-top:2px;
    }

    /* ── Save button ─────────────────────────────────────── */
    .savbtn{
      width:100%;
      padding:18px;
      background:var(--text-1);
      border:none;
      border-radius:var(--radius-md);
      cursor:pointer;
      font-family:var(--font-sans);
      font-size:15px;
      font-weight:600;
      color:#fff;
      margin-top:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:all .12s ease;
      box-shadow:var(--shadow-md);
      min-height:56px;
    }
    .savbtn:active{transform:scale(0.98);box-shadow:var(--shadow-sm)}
    .savbtn.sv{background:#E1F5EE;color:#085041;border:1px solid #5DCAA5;box-shadow:none}

    /* ── Quick stats ─────────────────────────────────────── */
    .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .qstat{
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      padding:14px 6px;
      text-align:center;
      box-shadow:var(--shadow-sm);
    }
    .qstat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
    .qicon{font-size:22px;color:var(--text-2);margin-bottom:6px}
    .qval{font-size:16px;font-weight:600;color:var(--text-1);letter-spacing:-0.01em}
    .qlbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-top:3px}

    /* ── Streak ─────────────────────────────────────── */
    .streak-row{display:grid;grid-template-columns:64px repeat(7,1fr);gap:5px;align-items:center;margin-bottom:6px}
    .streak-cell{
      aspect-ratio:1;
      border-radius:6px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:600;
    }
    .streak-on{background:#E1F5EE;color:#085041}
    .streak-off{background:var(--bg-soft);color:var(--text-3)}
    .streak-today{outline:2px solid var(--text-1);outline-offset:1px}

    /* ── Inputs ─────────────────────────────────────── */
    .run-input{
      width:100%;
      height:48px;
      padding:0 14px;
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      background:var(--bg-soft);
      font-family:var(--font-sans);
      font-size:16px; /* 16px prevents iOS zoom on focus */
      color:var(--text-1);
      transition:border-color .12s ease, background .12s ease;
      -webkit-appearance: none;
      appearance: none;
    }
    .run-input:focus{outline:none;border-color:var(--text-2);background:var(--bg-card)}
    /* Hide number input arrows */
    .run-input::-webkit-outer-spin-button,
    .run-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .run-input[type=number] { -moz-appearance: textfield; }

    .toggle-card{
      cursor:pointer;
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      padding:16px 18px;
      margin-bottom:12px;
      width:100%;
      text-align:left;
      font-family:var(--font-sans);
      box-shadow:var(--shadow-sm);
      min-height:64px;
    }
    .toggle-card.on{background:#E1F5EE;border-color:#5DCAA5}

    .cup-card{
      background:linear-gradient(135deg,#FBEAF0 0%,#FCEEF3 100%);
      border:1px solid #ED93B1;
      border-radius:var(--radius-md);
      padding:16px 18px;
      margin-bottom:12px;
    }
    .cup-section{
      padding:13px 14px;
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      margin-top:10px;
    }

    /* ── Decorative accent bar ─────────────────────────────────────── */
    .accent-bar{
      position:absolute;
      left:0; top:0; bottom:0;
      width:5px;
    }

    /* ── Horizontal scroll containers ─────────────────────────────────────── */
    .pill-row{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:8px;
      margin-bottom:18px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      scroll-snap-type: x proximity;
      padding-left: 2px;
      padding-right: 2px;
    }
    .pill-row::-webkit-scrollbar{display:none}
    .pill-row .pill { scroll-snap-align: start; }

    /* ── Macro tags inline ─────────────────────────────────────── */
    .macro-tag{
      padding:5px 11px;
      border-radius:7px;
      font-size:12px;
      font-weight:600;
    }
    .macro-e{background:#E6F1FB;border:1px solid #85B7EB;color:#0C447C}
    .macro-c{background:#FAEEDA;border:1px solid #EF9F27;color:#633806}
    .macro-v{background:#FBEAF0;border:1px solid #ED93B1;color:#72243E}

    /* ── Sticky training progress bar ─────────────────────────────────────── */
    .train-progress {
      position: sticky;
      top: 0;
      z-index: 4;
      background: rgba(255,255,255,0.96);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      margin: -16px -16px 14px;
      padding: 12px 16px 12px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .train-progress-info { flex: 1; min-width: 0; }
    .train-progress-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
    .train-progress-bar { height: 6px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; }
    .train-progress-fill { height: 100%; background: var(--text-1); transition: width .3s ease; border-radius: 3px; }
    .train-progress-pct { font-size: 14px; font-weight: 600; color: var(--text-1); flex-shrink: 0; }

    /* Section headers */
    .sec-header {
      font-size:11px;
      color:var(--text-3);
      text-transform:uppercase;
      letter-spacing:.7px;
      font-weight:600;
      margin: 8px 4px 12px;
    }

    /* iOS-style press ripple subtlety */
    @media (hover: hover) {
      .pill:hover { border-color: #cdd1d8; }
      .dbtn:hover { border-color: #cdd1d8; box-shadow: var(--shadow-sm); }
      .toggle-card:hover { border-color: #cdd1d8; }
      .wbtn:hover { border-color: #cdd1d8; background: var(--bg-card); }
      .sbtn:hover { border-color: #cdd1d8; }
      .savbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
      .exacc:hover { border-color: #cdd1d8; }
    }
  </style>
</head>
<body>

<div class="app">
  <div id="vandaag" class="sec on"></div>
  <div id="schema" class="sec"></div>
  <div id="training" class="sec"></div>
  <div id="voeding" class="sec"></div>
  <div id="shop" class="sec"></div>

  <div class="tabs">
    <button class="tb on" data-tab="vandaag" onclick="switchTab('vandaag')"><i class="ti ti-home"></i><span>Vandaag</span></button>
    <button class="tb" data-tab="schema" onclick="switchTab('schema')"><i class="ti ti-calendar"></i><span>Schema</span></button>
    <button class="tb" data-tab="training" onclick="switchTab('training')"><i class="ti ti-barbell"></i><span>Training</span></button>
    <button class="tb" data-tab="voeding" onclick="switchTab('voeding')"><i class="ti ti-leaf"></i><span>Voeding</span></button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  // --- TRAINING SCHEDULE: 5x per week (Upper / Lower / Push / Pull / Legs) ---
  const TD = (() => {
    const out = [];
    const start = new Date('2026-05-08');
    const end = new Date('2026-06-25');
    const map = {1:'upper', 2:'lower', 4:'push', 5:'pull', 6:'legs'};
    let s = 1;
    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
      const dow = d.getDay();
      const type = map[dow];
      if (type) {
        const date = d.toISOString().split('T')[0];
        out.push({ date, type, s: s++ });
      }
    }
    return out;
  })();

  const EX = {
    upper: [
      {id:'bench',n:'Bench Press',m:'Borst',w:60,sets:4,reps:8,c:1,u:'kg',tip:'Schouderbladen ingedrukt, voeten op vloer, stang gecontroleerd naar borst'},

      {id:'sohp',n:'Seated DB Shoulder Press',m:'Schouders',w:16,sets:3,reps:10,c:1,u:'kg/hand',tip:'Rug recht, dumbbells vanuit schouderhoogte verticaal persen'},
      {id:'dbrow',n:'Single-arm DB Row',m:'Rug',w:22,sets:3,reps:10,c:1,u:'kg/hand',tip:'Knie op bank, rug horizontaal, elleboog hoog trekken'},
      {id:'bbcurl',n:'Barbell Curl',m:'Biceps',w:30,sets:3,reps:10,c:0,u:'kg',tip:'Geen slingeren, ellebogen gefixeerd, volle stretch en knijp'},
      {id:'tpd',n:'Tricep Pushdown',m:'Triceps',w:22.5,sets:3,reps:12,c:0,u:'kg',tip:'Ellebogen strak langs lichaam, volle extensie, squeeze'},
    ],
    lower: [
      {id:'squat',n:'Barbell Back Squat',m:'Quads / Glutes',w:70,sets:4,reps:8,c:1,u:'kg',tip:'Schouderbreedte, heupen onder kniehoogte, borst omhoog'},
      {id:'rdl',n:'Romanian Deadlift',m:'Hamstrings / Glutes',w:62.5,sets:4,reps:8,c:1,u:'kg',tip:'Knieën licht gebogen, stang langs benen, rug recht'},
      {id:'lpress',n:'Leg Press',m:'Quads',w:100,sets:3,reps:12,c:1,u:'kg',tip:'Voeten schouderbreedte, knieën NIET volledig strekken'},

      {id:'calf',n:'Standing Calf Raise',m:'Kuiten',w:50,sets:4,reps:15,c:0,u:'kg',tip:'Volle stretch onderaan, explosief omhoog, pauze bovenkant'},
      {id:'plank',n:'Plank',m:'Core',w:45,sets:3,reps:1,c:0,u:'sec',tip:'Lichaam recht als plank, billen niet omhoog, buik aanspannen'},
    ],
    push: [
      {id:'incdb',n:'Incline DB Press',m:'Borst (boven)',w:18,sets:4,reps:10,c:1,u:'kg/hand',tip:'Bank op 30-45°, dumbbells langzaam omlaag, stretch voelen'},
      {id:'sohp',n:'Seated DB Shoulder Press',m:'Schouders',w:16,sets:4,reps:10,c:1,u:'kg/hand',tip:'Rug recht, dumbbells vanuit schouderhoogte verticaal persen'},
      {id:'cfly',n:'Cable Fly / Pec Deck',m:'Borst',w:25,sets:3,reps:12,c:0,u:'kg',tip:'Lichte buiging elleboog, borstspieren samentrekken en knijpen'},
      {id:'latr',n:'Lateral Raises',m:'Zijdeltoid',w:8,sets:3,reps:15,c:0,u:'kg/hand',tip:'Lichte buiging elleboog, tot schouderhoogte, langzaam terug'},
      {id:'skull',n:'Skull Crushers',m:'Triceps',w:22.5,sets:3,reps:12,c:0,u:'kg',tip:'EZ-bar, ellebogen omhoog, gecontroleerd omlaag'},
      {id:'tpd',n:'Tricep Pushdown',m:'Triceps',w:22.5,sets:3,reps:12,c:0,u:'kg',tip:'Ellebogen strak langs lichaam, volle extensie, squeeze'},
    ],
    pull: [
      {id:'pullup',n:'Pull-ups (of Lat Pulldown)',m:'Rug (breed)',w:0,sets:4,reps:8,c:1,u:'kg',tip:'Eigen gewicht; gewicht=extra belasting (0 = bodyweight). Volle hang, kin boven stang.'},
      {id:'scrow',n:'Seated Cable Row',m:'Rug (midden)',w:55,sets:4,reps:10,c:1,u:'kg',tip:'Rechte rug, ellebogen langs lichaam, volle range of motion'},
      {id:'dbrow',n:'Single-arm DB Row',m:'Rug',w:22,sets:3,reps:12,c:1,u:'kg/hand',tip:'Knie op bank, rug horizontaal, elleboog hoog trekken'},
      {id:'fpull',n:'Face Pulls',m:'Achterschouders',w:20,sets:3,reps:15,c:0,u:'kg',tip:'Touw naar gezicht, ellebogen hoog, achterschouder squeezen'},
      {id:'idcurl',n:'Incline DB Curl',m:'Biceps (long head)',w:10,sets:3,reps:12,c:0,u:'kg/hand',tip:'Bank op 60°, volle stretch onderaan voor maximale activatie'},
      {id:'hcurl',n:'Hammer Curl',m:'Biceps / Brachialis',w:12,sets:3,reps:12,c:0,u:'kg/hand',tip:'Neutrale grip, ellebogen gefixeerd, gecontroleerd tempo'},
    ],
    legs: [
      {id:'fsquat',n:'Front Squat (of High-bar)',m:'Quads',w:50,sets:4,reps:8,c:1,u:'kg',tip:'Quad-dominant. Ellebogen hoog, romp rechtop, dieper dan back squat.'},
      {id:'rdl',n:'Romanian Deadlift',m:'Hamstrings / Glutes',w:62.5,sets:3,reps:10,c:1,u:'kg',tip:'Knieën licht gebogen, stang langs benen, rug recht'},
      {id:'lunge',n:'Walking Lunges',m:'Quads / Glutes',w:14,sets:3,reps:10,c:1,u:'kg/hand',tip:'10 reps per been, grote stappen, knie boven enkel'},
      {id:'lcurl',n:'Leg Curl',m:'Hamstrings',w:37.5,sets:3,reps:12,c:0,u:'kg',tip:'Gecontroleerd omlaag, volle range of motion'},
      {id:'calf',n:'Standing Calf Raise',m:'Kuiten',w:50,sets:4,reps:15,c:0,u:'kg',tip:'Volle stretch onderaan, explosief omhoog, pauze bovenkant'},
      {id:'plank',n:'Plank',m:'Core',w:45,sets:3,reps:1,c:0,u:'sec',tip:'Lichaam recht als plank, billen niet omhoog, buik aanspannen'},
    ],
  };

  const TCONF = {
    upper: {label:'Upper', muscles:'Borst · Rug · Schouders · Armen', cls:'tu', pill:'au', col:'#B47AE0'},
    lower: {label:'Lower', muscles:'Quads · Hamstrings · Glutes · Core', cls:'tlw', pill:'alw', col:'#F08A6B'},
    push:  {label:'Push',  muscles:'Borst · Schouders · Triceps', cls:'tp', pill:'ap', col:'#5DCAA5'},
    pull:  {label:'Pull',  muscles:'Rug · Biceps · Achterschouders', cls:'tl', pill:'ab', col:'#85B7EB'},
    legs:  {label:'Legs',  muscles:'Quads · Hamstrings · Kuiten', cls:'tg', pill:'aa', col:'#EF9F27'},
  };

  // --- FIREBASE CONFIGURATION ---
  let useFirebase = false;
  let firebaseConfig = null;

  if (typeof __firebase_config !== 'undefined') {
    firebaseConfig = JSON.parse(__firebase_config);
    useFirebase = true;
  } else {
    firebaseConfig = {
      apiKey: "AIzaSyDmLxNeZmZf0eh3KaxGIiVCupbjJDVRYVI",
      authDomain: "workoutapp-573b9.firebaseapp.com",
      projectId: "workoutapp-573b9",
      storageBucket: "workoutapp-573b9.firebasestorage.app",
      messagingSenderId: "897583578240",
      appId: "1:897583578240:web:05e1f8249b340353e9fa65"
    };
    useFirebase = true;
  }

  let db, auth, currentUserId = null;
  const appId = typeof __app_id !== 'undefined' ? __app_id : 'summer-body-app';
  let isFirebaseReady = false;

  // --- LOCAL FIRST: render immediately so there's no white flash ---
  loadLocalFirst();
  safe(rVandaag);

  if (useFirebase) {
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);

    const initAuth = async () => {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (e) { console.error('auth error', e); }
    };
    initAuth();

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
        isFirebaseReady = true;
        loadCloud().then(() => {
          const active = document.querySelector('.tb.on')?.dataset.tab || 'vandaag';
          rerenderActive(active);
        });
      } else {
        currentUserId = null;
        isFirebaseReady = false;
      }
    });
  }

  // --- STORAGE FUNCTIONS ---
  function lget(key) {
    try { const v = localStorage.getItem('sb_'+key); return v ? JSON.parse(v) : null; } catch { return null; }
  }
  function lset(key, val) {
    try { localStorage.setItem('sb_'+key, JSON.stringify(val)); } catch {}
  }

  async function cloudGet(key) {
    if (!useFirebase || !isFirebaseReady || !currentUserId) return null;
    try {
      const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, key, 'doc');
      const snap = await getDoc(docRef);
      if (snap.exists()) return JSON.parse(snap.data().data);
      return null;
    } catch(e) { console.error(e); return null; }
  }
  async function cloudSet(key, val) {
    if (!useFirebase || !isFirebaseReady || !currentUserId) return;
    try {
      const docRef = doc(db, 'artifacts', appId, 'users', currentUserId, key, 'doc');
      await setDoc(docRef, { data: JSON.stringify(val) });
    } catch(e) { console.error(e); }
  }

  async function sset(key, val) {
    lset(key, val);
    cloudSet(key, val);
  }

  // --- STATE ---
  let avail={}, weights={}, logs={}, shopCk={}, daily={};
  let selDate=null, vDay=0, sLog={}, expEx=null, ssSaved=false, expMeal=null, expCup=null;
  const TODAY = (()=>{ try { return new Date().toISOString().split('T')[0]; } catch { return '2026-05-08'; } })();

  function loadLocalFirst() {
    const a = lget('avail'); if (a) avail = a;
    const w = lget('weights'); if (w) weights = w;
    const l = lget('logs'); if (l) logs = l;
    const s = lget('shop'); if (s) shopCk = s;
    const d = lget('daily'); if (d) daily = d;
  }

  async function loadCloud() {
    try {
      const [a,w,l,s,d] = await Promise.all([
        cloudGet('avail'), cloudGet('weights'), cloudGet('logs'), cloudGet('shop'), cloudGet('daily')
      ]);
      if (a) { avail = a; lset('avail', a); }
      if (w) { weights = w; lset('weights', w); }
      if (l) { logs = l; lset('logs', l); }
      if (s) { shopCk = s; lset('shop', s); }
      if (d) { daily = d; lset('daily', d); }
    } catch(e) { console.error(e); }
  }

  function rerenderActive(tab) {
    if (tab==='vandaag') safe(rVandaag);
    if (tab==='schema') safe(rSchema);
    if (tab==='training') safe(rTraining);
    if (tab==='voeding') safe(rVoeding);
    if (tab==='shop') safe(rShop);
  }

  // --- HELPERS ---
  function gw(id){if(weights[id]!==undefined)return weights[id];for(const k of Object.keys(EX)){const e=EX[k].find(e=>e.id===id);if(e)return e.w}return 0}
  function nxtW(cur,done,target,compound){if(done>=target)return Math.round((cur+(compound?2.5:1.25))*4)/4;if(done>=Math.ceil(target*.75))return cur;return Math.round((cur*.95)*4)/4}
  function isAv(d){return avail[d]!==false}
  function isTrainDay(d){return!!TD.find(td=>td.date===d&&isAv(td.date))}
  function waterTarget(d){return isTrainDay(d)?3500:3000}
  function getDay(d){return daily[d]||{water:0,sleep:0,creat:false,runKm:0,runMin:0}}

  function switchTab(tab){
    document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))
    document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id===tab))
    // Scroll naar boven bij tab-switch — voorkomt verwarring
    window.scrollTo({top: 0, behavior: 'instant'});
    rerenderActive(tab);
  }
  function safe(fn){try{fn()}catch(e){console.error(e)}}

  function dn(d){return['Zo','Ma','Di','Wo','Do','Vr','Za'][new Date(d).getDay()]}
  function dnL(d){return['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'][new Date(d).getDay()]}
  function dnum(d){return new Date(d).getDate()}
  function fdate(str){const d=new Date(str);const mn=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];return`${dnL(str)} ${d.getDate()} ${mn[d.getMonth()]}`}

  // --- VANDAAG ---
  function rVandaag(){
    const el=document.getElementById('vandaag')
    const t=TODAY,d=getDay(t),wt=waterTarget(t),wpct=Math.min(100,Math.round(d.water/wt*100))
    const td=TD.find(x=>x.date===t&&isAv(x.date))
    const dow=new Date(t).getDay()
    const isWeekend=dow===0||dow===6

    let tdyCard=''
    if(td){const cfg=TCONF[td.type]
      tdyCard=`<button class="card-feature" style="cursor:pointer;width:100%;text-align:left;font-family:var(--font-sans);border:none" onclick="goToTraining('${t}')">
        <div class="accent-bar" style="background:${cfg.col}"></div>
        <div class="bet">
          <div style="min-width:0">
            <span class="tag ${cfg.cls}" style="margin-bottom:10px;display:inline-block">${cfg.label} day · sessie #${td.s}</span>
            <div class="t1">Vandaag is een trainingsdag</div>
            <div class="t4" style="margin-top:4px">${cfg.muscles}</div>
          </div>
          <i class="ti ti-arrow-right" style="font-size:24px;color:var(--text-2);flex-shrink:0"></i>
        </div></button>`
    }else{
      tdyCard=`<div class="card-feature">
        <div class="accent-bar" style="background:#AFA9EC"></div>
        <span class="tag tr" style="margin-bottom:10px;display:inline-block">Rustdag</span>
        <div class="t1">Vandaag geen krachttraining</div>
        <div class="t4" style="margin-top:4px">${isWeekend?'Perfect voor een rondje hardlopen — 30-45 min rustig tempo':'Focus op herstel: water, slaap en eiwit'}</div>
      </div>`
    }
    const qs=`<div class="qstat-grid">
      <div class="qstat"><i class="ti ti-droplet-filled qicon" style="color:#185FA5"></i><div class="qval">${(d.water/1000).toFixed(1)}L</div><div class="qlbl">Water</div></div>
      <div class="qstat"><i class="ti ti-moon-filled qicon" style="color:#534AB7"></i><div class="qval">${d.sleep||'—'}${d.sleep?'h':''}</div><div class="qlbl">Slaap</div></div>
      <div class="qstat"><i class="ti ti-pill qicon" style="color:#1D9E75"></i><div class="qval">${d.creat?'<i class="ti ti-check"></i>':'—'}</div><div class="qlbl">Creatine</div></div>
      <div class="qstat"><i class="ti ti-run qicon" style="color:#D85A30"></i><div class="qval">${d.runKm?d.runKm+'km':'—'}</div><div class="qlbl">Run</div></div>
    </div>`
    const water=`<div class="card">
      <div class="bet" style="margin-bottom:14px">
        <div><div class="t1"><i class="ti ti-droplet" style="color:#185FA5"></i> Water</div><div class="t4" style="margin-top:2px">Doel: ${wt/1000}L (${isTrainDay(t)?'trainingsdag':'rustdag'})</div></div>
        <div class="t3" style="font-weight:600;color:${wpct>=100?'#1D9E75':'var(--text-1)'}">${wpct}%</div>
      </div>
      <div class="wctrl">
        <button class="wbtn" onclick="adjW(-250)" aria-label="-250ml">−</button>
        <div class="wval">${(d.water/1000).toFixed(2)}L <span class="t4">/ ${wt/1000}L</span></div>
        <button class="wbtn" onclick="adjW(250)" aria-label="+250ml">+</button>
      </div>
      <div class="ptrack"><div class="pfill" style="width:${wpct}%;background:#378ADD"></div></div>
      <p class="t4" style="margin-top:12px">+250ml per tap · creatine vraagt extra hydratatie</p>
    </div>`
    const sleepH=d.sleep||0,sleepGood=sleepH>=7&&sleepH<=9
    const sleep=`<div class="card">
      <div class="bet" style="margin-bottom:14px">
        <div><div class="t1"><i class="ti ti-moon" style="color:#534AB7"></i> Slaap</div><div class="t4" style="margin-top:2px">Doel: 7-8 uur</div></div>
        <div class="t3" style="font-weight:600;color:${sleepGood?'#1D9E75':'var(--text-2)'}">${sleepGood?'<i class="ti ti-check"></i> goed':sleepH>0?'kort':'—'}</div>
      </div>
      <div class="wctrl">
        <button class="wbtn" onclick="adjS(-0.5)" aria-label="-30 min">−</button>
        <div class="wval">${sleepH}<span class="t4"> uur</span></div>
        <button class="wbtn" onclick="adjS(0.5)" aria-label="+30 min">+</button>
      </div>
    </div>`
    const creat=`<button class="toggle-card${d.creat?' on':''}" onclick="tgCreat()">
      <div class="bet">
        <div><div class="t1"><i class="ti ti-pill" style="color:#1D9E75"></i> Creatine 5g vandaag</div><div class="t4" style="margin-top:2px">Door je shake of glas water</div></div>
        <div class="cb${d.creat?' on':''}">${d.creat?'<i class="ti ti-check"></i>':''}</div>
      </div>
    </button>`
    const runDone=d.runKm>0||d.runMin>0
    const run=`<div class="card">
      <div class="bet" style="margin-bottom:14px">
        <div><div class="t1"><i class="ti ti-run" style="color:#D85A30"></i> Hardlopen</div><div class="t4" style="margin-top:2px">${isWeekend?'Weekend - ideaal voor een rustige run':'Optioneel - bij voorkeur weekend'}</div></div>
        ${runDone?`<span class="tag" style="background:#FAECE7;color:#993C1D;border:1px solid #F0997B"><i class="ti ti-check"></i> ${d.runKm}km</span>`:''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div><div class="t4" style="margin-bottom:6px">Afstand (km)</div><input class="run-input" type="number" inputmode="decimal" enterkeyhint="done" min="0" step="0.1" value="${d.runKm||''}" placeholder="0" onchange="updR('runKm',this.value)" /></div>
        <div><div class="t4" style="margin-bottom:6px">Tijd (min)</div><input class="run-input" type="number" inputmode="numeric" enterkeyhint="done" min="0" step="1" value="${d.runMin||''}" placeholder="0" onchange="updR('runMin',this.value)" /></div>
      </div>
      ${d.runKm>0&&d.runMin>0?`<p class="t4" style="margin-top:12px">Tempo: ${(d.runMin/d.runKm).toFixed(2)} min/km · ~${Math.round(d.runKm*70)} kcal</p>`:''}
    </div>`
    const last7=[]
    const tD=new Date(t)
    for(let i=6;i>=0;i--){const dt=new Date(tD);dt.setDate(tD.getDate()-i);const ds=dt.toISOString().split('T')[0],dd=getDay(ds),wT=waterTarget(ds);last7.push({date:ds,day:dn(ds),water:dd.water>=wT*.85,sleep:dd.sleep>=7,creat:dd.creat,run:dd.runKm>0||dd.runMin>0})}
    function streakRow(label,key,icon,color){return`<div class="streak-row">
      <div class="t3" style="display:flex;align-items:center;gap:6px;font-weight:500"><i class="ti ${icon}" style="color:${color};font-size:15px"></i> ${label}</div>
      ${last7.map(d=>`<div class="streak-cell ${d[key]?'streak-on':'streak-off'}${d.date===TODAY?' streak-today':''}" title="${d.day}">${d[key]?'✓':''}</div>`).join('')}
    </div>`}
    const streaks=`<div class="card">
      <div class="t1" style="margin-bottom:14px">Laatste 7 dagen</div>
      <div class="streak-row" style="margin-bottom:8px"><div></div>${last7.map(d=>`<div class="t4" style="text-align:center;font-weight:600">${d.day}</div>`).join('')}</div>
      ${streakRow('Water','water','ti-droplet','#185FA5')}
      ${streakRow('Slaap','sleep','ti-moon','#534AB7')}
      ${streakRow('Creatine','creat','ti-pill','#1D9E75')}
      ${streakRow('Run','run','ti-run','#D85A30')}
    </div>`
    el.innerHTML=`
      <div class="top-strip">
        <div class="top-strip-eyebrow">${dnL(t).toLowerCase()}</div>
        <div class="top-strip-title">${fdate(t)}</div>
      </div>
      <div style="padding-top:16px">
        ${tdyCard}${qs}${water}${sleep}${creat}${run}${streaks}
      </div>`
    setupScrollDetection(el);
  }

  function setupScrollDetection(el) {
    const strip = el.querySelector('.top-strip');
    if (!strip) return;
    const onScroll = () => {
      strip.classList.toggle('scrolled', window.scrollY > 4);
    };
    window.removeEventListener('scroll', window._scrollHandler);
    window._scrollHandler = onScroll;
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  // --- TRAINING ---
  function rTraining(){
    const el=document.getElementById('training')
    const avDays=TD.filter(d=>isAv(d.date))
    if(!selDate)selDate=avDays.find(d=>d.date>=TODAY)?.date||avDays[0]?.date
    const day=TD.find(d=>d.date===selDate)
    const pillsH=`<div class="pill-row">
      ${avDays.map(d=>{const cfg=TCONF[d.type],ia=d.date===selDate,hl=logs[d.date]&&Object.keys(logs[d.date]).length>0
        return`<button class="pill${ia?' '+cfg.pill:''}" onclick="selD('${d.date}')">${dnum(d.date)}/${new Date(d.date).getMonth()+1} · ${cfg.label.slice(0,2)}${hl?' ✓':''}</button>`}).join('')}
    </div>`
    if(!day){el.innerHTML=pillsH+'<p class="t2">Selecteer een trainingssessie hierboven.</p>';return}
    const cfg=TCONF[day.type],exs=EX[day.type]
    if(!sLog._date||sLog._date!==selDate){sLog={_date:selDate};exs.forEach(ex=>{sLog[ex.id]=logs[selDate]?.[ex.id]||{sets:Array(ex.sets).fill(false),weight:gw(ex.id)}})}

    // Calculate overall progress for the sticky bar
    let totalSets = 0, doneSets = 0;
    exs.forEach(ex => {
      totalSets += ex.sets;
      doneSets += sLog[ex.id].sets.filter(Boolean).length;
    });
    const sessionPct = totalSets > 0 ? Math.round(doneSets / totalSets * 100) : 0;

    const stickyProgress = `<div class="train-progress">
      <div class="train-progress-info">
        <div class="train-progress-label">${cfg.label} · sessie #${day.s}</div>
        <div class="train-progress-bar"><div class="train-progress-fill" style="width:${sessionPct}%;background:${cfg.col}"></div></div>
      </div>
      <div class="train-progress-pct">${doneSets}/${totalSets}</div>
    </div>`;

    const exH=exs.map((ex,i)=>{const lg=sLog[ex.id],dnC=lg.sets.filter(Boolean).length,allD=dnC===ex.sets,isE=expEx===ex.id
      const wshow=ex.u==='sec'?lg.weight+'s':lg.weight+' '+(ex.u==='kg/hand'?'kg/h':'kg')
      const setsClass = ex.sets > 4 ? 'srow' : (ex.sets <= 3 ? 'srow s3' : 'srow');
      return`<div class="exacc">
        <button class="exhdr" onclick="tgEx('${ex.id}')">
          <div style="width:32px;height:32px;border-radius:50%;background:${allD?'#E1F5EE':'var(--bg-soft)'};border:1px solid ${allD?'#5DCAA5':'var(--border)'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:${allD?'#085041':'var(--text-2)'};flex-shrink:0">${allD?'<i class="ti ti-check"></i>':i+1}</div>
          <div style="flex:1;min-width:0"><div class="t1">${ex.n}</div><div class="t4" style="margin-top:2px">${ex.m}</div></div>
          <div style="text-align:right;margin-right:6px;flex-shrink:0"><div class="t3" style="font-weight:600;font-size:12.5px">${ex.sets}×${ex.reps}${ex.u==='sec'?'s':''}</div><div class="t4" style="margin-top:2px">@ ${wshow}</div></div>
          <i class="ti ti-chevron-${isE?'up':'down'}" style="font-size:18px;color:var(--text-3);flex-shrink:0"></i>
        </button>
        ${isE?`<div class="exbdy">
          <div class="tipbox"><i class="ti ti-bulb"></i><span>${ex.tip}</span></div>
          ${ex.u!=='sec'?`<p class="h-eyebrow" style="margin-bottom:10px">Gewicht aanpassen</p>
          <div class="wctrl" style="margin-bottom:20px">
            <button class="wbtn" onclick="adjEW('${ex.id}',${ex.c?-2.5:-1.25})" aria-label="Lager">−</button>
            <div class="wval">${lg.weight} <span class="t4">${ex.u==='kg/hand'?'kg/hand':'kg'}</span></div>
            <button class="wbtn" onclick="adjEW('${ex.id}',${ex.c?2.5:1.25})" aria-label="Hoger">+</button>
          </div>`:''}
          <p class="h-eyebrow" style="margin-bottom:10px">Sets afvinken</p>
          <div class="${setsClass}">${lg.sets.map((done,si)=>`<button class="sbtn${done?' done':''}" onclick="tgSet('${ex.id}',${si})">${done?'<i class="ti ti-check"></i>':si+1}</button>`).join('')}</div>
        </div>`:''}
      </div>`}).join('')
    let nwH=''
    if(ssSaved){nwH=`<div class="card" style="margin-top:14px">
      <p class="t1" style="margin-bottom:14px"><i class="ti ti-trending-up" style="color:#1D9E75"></i> Volgende sessie (berekend gewicht)</p>
      ${exs.map(ex=>{const lg=sLog[ex.id],done=lg.sets.filter(Boolean).length,cur=lg.weight,nxt=nxtW(cur,done,ex.sets,ex.c),diff=Math.round((nxt-cur)*4)/4
        return`<div class="bet" style="padding:10px 0;border-bottom:1px solid var(--border-soft)">
          <span class="t3" style="font-weight:500">${ex.n}</span>
          <span style="font-size:13px">${cur}→<strong style="color:${diff>0?'#1D9E75':diff<0?'#D85A30':'var(--text-1)'}">${nxt}${ex.u==='sec'?'s':'kg'}</strong>${diff>0?` <span style="font-size:11px;color:#1D9E75">(+${diff})</span>`:diff<0?` <span style="font-size:11px;color:#D85A30">(${diff})</span>`:''}</span>
        </div>`}).join('')}</div>`}
    el.innerHTML=stickyProgress+pillsH+`
      <div class="card-feature" style="margin-bottom:18px">
        <div class="accent-bar" style="background:${cfg.col}"></div>
        <div class="bet">
          <div style="min-width:0"><span class="tag ${cfg.cls}" style="margin-bottom:8px;display:inline-block">${cfg.label} day</span><div class="t2" style="font-weight:500">${fdate(selDate)}</div><div class="t4" style="margin-top:2px">${cfg.muscles}</div></div>
          <div style="text-align:right;flex-shrink:0"><div class="t4">Sessie</div><div class="nbig">#${day.s}</div></div>
        </div>
      </div>
      ${exH}
      <button class="savbtn${ssSaved?' sv':''}" onclick="saveSess()">
        <i class="ti ti-${ssSaved?'check':'device-floppy'}"></i>
        ${ssSaved?'Sessie opgeslagen':'Sessie opslaan + evalueren'}
      </button>${nwH}`
  }

  function tgSet(id,si){sLog[id].sets[si]=!sLog[id].sets[si];safe(rTraining)}

    const day=TD.find(d=>d.date===selDate);if(!day)return
    const exs=EX[day.type],nL={...logs,[selDate]:{...(logs[selDate]||{})}},nW={...weights}
